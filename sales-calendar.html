<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F8F5F1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/pwa/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/pwa/icon-192.png">
<title>Sales Log — Creator Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200;300;400;500;600;700&family=Stack+Sans+Text:wght@200..700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">

<style>
:root{--r:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Serif',serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.page{max-width:900px;margin:0 auto;padding:0 40px 100px;}
.page-header{padding:44px 0 32px;border-bottom:1px solid var(--border-mid);margin-bottom:36px;}
.page-eyebrow{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--rust);margin-bottom:10px;}
.page-title{font-family:'IBM Plex Serif',serif;font-size:52px;font-weight:700;line-height:0.9;letter-spacing:-0.02em;color:var(--ink);}
.page-title em{font-style:italic;color:var(--sage);}
.page-sub{font-size:13px;color:var(--text-mid);margin-top:10px;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.month-label{font-family:'IBM Plex Serif',serif;font-size:32px;font-weight:700;color:var(--ink);}
.month-btns{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:0.04em;cursor:pointer;font-family:'Stack Sans Notch',sans-serif;transition:all 0.15s;border:none;text-transform:uppercase;}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border-mid);}.btn-ghost:hover{background:var(--surface);color:var(--ink);}
.btn-primary{background:var(--rust);color:#fff;}.btn-primary:hover{background:#9a5a57;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border-mid);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm);}
.cal-dow{background:var(--surface);padding:10px 0;font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);text-align:center;}
.cal-day{background:var(--surface);padding:10px 12px;min-height:88px;cursor:pointer;transition:background 0.12s;display:flex;flex-direction:column;gap:3px;position:relative;}
.cal-day:hover{background:color-mix(in srgb,var(--surface) 82%,var(--rust) 18%);}
.cal-day.empty{background:color-mix(in srgb,var(--bg) 82%,var(--surface) 18%);cursor:default;}
.cal-day.other-month{background:color-mix(in srgb,var(--surface) 42%,var(--bg) 58%);cursor:pointer;}
.cal-day.other-month:hover{background:color-mix(in srgb,var(--surface) 58%,var(--rust) 12%);}
.cal-day.other-month .cal-day-num{color:color-mix(in srgb,var(--text-muted) 52%,transparent);}
.cal-day.today{outline:2px solid var(--rust);outline-offset:-2px;}
.cal-day.has-data{background:color-mix(in srgb,var(--surface) 76%,var(--rust) 10%);}
.cal-day.has-data:hover{background:color-mix(in srgb,var(--surface) 70%,var(--rust) 18%);}
.cal-day-num{font-family:'Noto Sans Mono',sans-serif;font-size:12px;font-weight:600;color:var(--text-mid);}
.cal-day.today .cal-day-num{color:var(--rust);font-weight:700;}
.cal-units{font-family:'Noto Sans Mono',sans-serif;font-size:12px;font-weight:600;color:var(--ink);}
.cal-gmv{font-family:'Noto Sans Mono',sans-serif;font-size:11px;color:var(--sage);font-weight:600;}
.cal-comm{font-family:'Noto Sans Mono',sans-serif;font-size:11px;color:var(--rust);font-weight:600;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--rose);position:absolute;top:8px;right:9px;}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px;}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm);}
.sum-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.sum-val{font-family:'Noto Sans Mono',sans-serif;font-size:26px;font-weight:700;color:var(--ink);line-height:1;}
.sum-sub{font-size:11px;color:var(--text-mid);margin-top:3px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,39,37,0.4);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-lift);border-radius:16px;padding:32px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(42,39,37,0.15);position:relative;}
.modal-title{font-family:'IBM Plex Serif',serif;font-size:26px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.modal-date{font-size:13px;color:var(--text-mid);margin-bottom:24px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}
.form-row{margin-bottom:16px;}
.form-label{display:block;font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-mid);margin-bottom:6px;}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--border-mid);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:'Noto Sans Mono',sans-serif;font-size:18px;font-weight:600;outline:none;transition:border-color 0.15s;}
.form-input:focus{border-color:var(--rust);}
.form-input-sm{font-family:'IBM Plex Serif',serif;font-size:14px;font-weight:400;resize:vertical;min-height:60px;}
.form-row-half{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.log-section{margin-top:36px;}
.log-title{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink);margin-bottom:14px;}
.log-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-radius:8px;border:1px solid var(--border);margin-bottom:6px;flex-wrap:wrap;}
.log-date{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:600;color:var(--text-mid);min-width:100px;letter-spacing:0.04em;}
.log-units{font-family:'Noto Sans Mono',sans-serif;font-size:18px;font-weight:700;color:var(--ink);min-width:36px;}
.log-gmv{font-family:'Noto Sans Mono',sans-serif;font-size:13px;font-weight:600;color:var(--sage);}
.log-comm{font-family:'Noto Sans Mono',sans-serif;font-size:13px;font-weight:600;color:var(--rust);}
.log-note{font-size:12px;color:var(--text-mid);flex:1;font-style:italic;}
.log-edit{background:none;border:1px solid var(--border-mid);border-radius:6px;padding:3px 10px;font-family:'Stack Sans Notch',sans-serif;font-size:11px;cursor:pointer;color:var(--text-muted);margin-left:auto;transition:all 0.12s;text-transform:uppercase;}
.log-edit:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
footer{border-top:1px solid var(--border);padding:24px 48px;display:flex;align-items:center;justify-content:space-between;}
.footer-brand{font-family:'Stack Sans Notch',sans-serif;font-size:16px;font-weight:700;color:var(--ink);}
.footer-note{font-size:11px;color:var(--text-muted);}
body{overflow-x:hidden;}
@media(max-width:768px){.page{padding:80px 16px 24px;}.page-title{font-size:40px;}.cal-day{min-height:64px;padding:7px 6px;}.summary-strip{grid-template-columns:repeat(2,1fr);}.form-row-half{grid-template-columns:1fr;}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=95"></script>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">Creator Hub</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="daily-todo.html" class="nav-link">To Do</a>
    <a href="products.html" class="nav-link">Products</a>
    <a href="video-tracker.html" class="nav-link">Videos</a>
    <a href="hooks.html" class="nav-link">Hooks</a>
    <a href="scripts.html" class="nav-link">Scripts</a>
    <a href="sales-calendar.html" class="nav-link active">Sales Log</a>
  </div>

</nav>
<div class="page">
  <div class="page-header">
    <div class="page-eyebrow">Track · Log · Review</div>
    <div class="page-title">Sales <em>Log</em></div>
    <p class="page-sub">Tap any day to log units sold, GMV, and commissions.</p>
  </div>
  <div class="month-nav">
    <div class="month-label" id="monthLabel"></div>
    <div class="month-btns">
      <button class="btn btn-ghost" onclick="changeMonth(-1)">&#8592; Prev</button>
      <button class="btn btn-ghost" onclick="changeMonth(0)">Today</button>
      <button class="btn btn-ghost" onclick="changeMonth(1)">Next &#8594;</button>
    </div>
  </div>
  <div class="cal-grid" id="calGrid">
    <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
    <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
  </div>
  <div class="summary-strip" id="summaryStrip"></div>
  <div class="log-section"><div class="log-title">Recent Entries</div><div id="recentLog"></div></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div class="modal-title" id="modalTitle">Log Sales</div>
    <div class="modal-date" id="modalDateLabel"></div>
    <div class="form-row-half">
      <div class="form-row" style="margin-bottom:0"><label class="form-label">Units Sold</label><input type="number" class="form-input" id="fUnits" min="0" placeholder="0"></div>
      <div class="form-row" style="margin-bottom:0"><label class="form-label">GMV ($)</label><input type="number" class="form-input" id="fGmv" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="form-row" style="margin-top:14px"><label class="form-label">Commission ($)</label><input type="number" class="form-input" id="fComm" min="0" step="0.01" placeholder="0.00"></div>
    <div class="form-row"><label class="form-label">Note (optional)</label><textarea class="form-input form-input-sm" id="fNote" placeholder="Top product, anything notable..."></textarea></div>
    <div class="modal-actions"><button class="btn btn-primary" style="flex:1;" onclick="saveEntry()">Save</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
  </div>
</div>
<footer><div class="footer-brand">Creator Hub</div><div class="footer-note">TikTok Shop Creator Workspace</div></footer>
<script src="layout.js?v=95"></script>
<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let viewYear, viewMonth, editingKey=null, _user=null, _salesCache={};
const today=new Date(); viewYear=today.getFullYear(); viewMonth=today.getMonth();

function fmtMoney(n){return'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

async function init(){
  const user=await requireAuth(); if(!user)return;
  const prefs = await loadUserPrefs(user.id);
  await initDisplayName(user, prefs);
  await initCore5(user.id, prefs);
  await initTheme(user.id, prefs);
  initProfilePopover(user.id);
  _user=user;
  await loadMonth();
}

async function loadMonth(){
  const start=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-01`;
  const end=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${new Date(viewYear,viewMonth+1,0).getDate()}`;
  const {data}=await db.from('sales').select('*').eq('user_id',_user.id).gte('date',start).lte('date',end);
  _salesCache={};
  (data||[]).forEach(r=>{ _salesCache[r.date]=r; });
  render();
}

function changeMonth(dir){
  if(dir===0){viewYear=today.getFullYear();viewMonth=today.getMonth();}
  else{viewMonth+=dir;if(viewMonth>11){viewMonth=0;viewYear++;}if(viewMonth<0){viewMonth=11;viewYear--;}}
  loadMonth();
}

function render(){
  document.getElementById('monthLabel').textContent=`${MONTHS[viewMonth]} ${viewYear}`;
  const grid=document.getElementById('calGrid');
  while(grid.children.length>7)grid.removeChild(grid.lastChild);
  const firstDay=new Date(viewYear,viewMonth,1).getDay();
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  const prevYear=viewMonth===0?viewYear-1:viewYear;
  const prevMonth=viewMonth===0?11:viewMonth-1;
  const daysInPrevMonth=new Date(prevYear,prevMonth+1,0).getDate();
  for(let i=0;i<firstDay;i++){
    const d=daysInPrevMonth-firstDay+i+1;
    const cell=document.createElement('div');
    cell.className='cal-day other-month';
    const key=`${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cell.onclick=()=>{viewYear=prevYear;viewMonth=prevMonth;loadMonth().then(()=>openModal(key,d));};
    cell.innerHTML='<div class="cal-day-num">'+d+'</div>';
    grid.appendChild(cell);
  }
  for(let d=1;d<=daysInMonth;d++){
    const key=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const entry=_salesCache[key];
    const isToday=viewYear===today.getFullYear()&&viewMonth===today.getMonth()&&d===today.getDate();
    const cell=document.createElement('div');
    cell.className='cal-day'+(isToday?' today':'')+(entry?' has-data':'');
    cell.onclick=()=>openModal(key,d);
    cell.innerHTML='<div class="cal-day-num">'+d+'</div>'+
      (entry?((entry.units?'<div class="cal-units">'+entry.units+'u</div>':'')+
      (entry.gmv?'<div class="cal-gmv">'+fmtMoney(entry.gmv)+'</div>':'')+
      (entry.comm?'<div class="cal-comm">'+fmtMoney(entry.comm)+'</div>':'')+
      '<div class="cal-dot"></div>'):'');
    grid.appendChild(cell);
  }
  const filled=firstDay+daysInMonth;
  const trailing=(7-(filled%7))%7;
  const nextYear=viewMonth===11?viewYear+1:viewYear;
  const nextMonth=viewMonth===11?0:viewMonth+1;
  for(let d=1;d<=trailing;d++){
    const key=`${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell=document.createElement('div');
    cell.className='cal-day other-month';
    cell.onclick=()=>{viewYear=nextYear;viewMonth=nextMonth;loadMonth().then(()=>openModal(key,d));};
    cell.innerHTML='<div class="cal-day-num">'+d+'</div>';
    grid.appendChild(cell);
  }
  let mUnits=0,mGmv=0,mComm=0,daysLogged=0;
  Object.values(_salesCache).forEach(e=>{mUnits+=parseInt(e.units)||0;mGmv+=parseFloat(e.gmv)||0;mComm+=parseFloat(e.comm)||0;daysLogged++;});
  document.getElementById('summaryStrip').innerHTML=
    '<div class="sum-card"><div class="sum-label">Units Sold</div><div class="sum-val">'+mUnits.toLocaleString()+'</div><div class="sum-sub">this month</div></div>'+
    '<div class="sum-card"><div class="sum-label">GMV</div><div class="sum-val" style="font-size:20px;">'+fmtMoney(mGmv)+'</div><div class="sum-sub">this month</div></div>'+
    '<div class="sum-card"><div class="sum-label">Commission</div><div class="sum-val" style="font-size:20px;">'+fmtMoney(mComm)+'</div><div class="sum-sub">earned</div></div>'+
    '<div class="sum-card"><div class="sum-label">Days Logged</div><div class="sum-val">'+daysLogged+'</div><div class="sum-sub">of '+new Date(viewYear,viewMonth+1,0).getDate()+'</div></div>';
  const entries=Object.entries(_salesCache).sort((a,b)=>b[0].localeCompare(a[0]));
  const logEl=document.getElementById('recentLog');
  if(!entries.length){logEl.innerHTML='<p style="color:var(--text-muted);font-size:13px;padding:16px 0;">No entries this month yet.</p>';return;}
  logEl.innerHTML=entries.map(([key,e])=>{
    const d=new Date(key+'T00:00:00');
    const dateStr=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    return '<div class="log-row">'+
      '<div class="log-date">'+dateStr+'</div>'+
      (e.units?'<div class="log-units">'+e.units+'</div>':'')+
      (e.gmv?'<div class="log-gmv">'+fmtMoney(e.gmv)+' GMV</div>':'')+
      (e.comm?'<div class="log-comm">'+fmtMoney(e.comm)+' comm</div>':'')+
      (e.note?'<div class="log-note">'+e.note+'</div>':'<div class="log-note"></div>')+
      '<button class="log-edit" onclick="openModal(\''+key+'\','+d.getDate()+')">Edit</button>'+
    '</div>';
  }).join('');
}

function openModal(key,day){
  editingKey=key;
  const entry=_salesCache[key];
  const d=new Date(viewYear,viewMonth,day);
  document.getElementById('modalTitle').textContent=entry?'Edit Entry':'Log Sales';
  document.getElementById('modalDateLabel').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('fUnits').value=entry?.units||'';
  document.getElementById('fGmv').value=entry?.gmv||'';
  document.getElementById('fComm').value=entry?.comm||'';
  document.getElementById('fNote').value=entry?.note||'';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fUnits').focus(),100);
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editingKey=null;}

async function saveEntry(){
  const units=parseInt(document.getElementById('fUnits').value)||0;
  const gmv=parseFloat(document.getElementById('fGmv').value)||0;
  const comm=parseFloat(document.getElementById('fComm').value)||0;
  const note=document.getElementById('fNote').value.trim();
  const existing=_salesCache[editingKey];
  if(existing){
    await db.from('sales').update({units,gmv,comm,note}).eq('id',existing.id);
  } else {
    await db.from('sales').insert({user_id:_user.id,date:editingKey,units,gmv,comm,note});
  }
  showToast('Saved');
  closeModal();
  await loadMonth();
}

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('modalOverlay').addEventListener('keydown',e=>enterSaves(e,saveEntry));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
init();
</script>
</body>
