<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Film Board — Take24</title>
<script src="theme-init.js?v=352"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font:14px 'Nunito Sans',sans-serif;padding:26px;padding-top:max(26px,env(safe-area-inset-top));}
.wrap{max-width:1320px;margin:0 auto;}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
h1{font:300 40px 'Cormorant Garamond',serif;color:var(--ink);line-height:1;}
.sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--border-mid);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font:800 11px 'Nunito Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.btn:hover{border-color:var(--tan);} .btn.primary{background:var(--rust);border-color:var(--rust);color:#fff;} .btn.sm{padding:6px 11px;font-size:10px;}
.dnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border-mid);border-radius:999px;padding:4px 6px;}
.dnav button{background:none;border:none;color:var(--ink);font-size:18px;cursor:pointer;padding:0 8px;}
.dnav b{font:400 19px 'Cormorant Garamond',serif;color:var(--ink);min-width:150px;text-align:center;cursor:pointer;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border-mid);border-radius:10px;padding:9px 11px;color:var(--ink);font:13.5px 'Nunito Sans',sans-serif;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--tan);}
textarea{resize:vertical;line-height:1.55;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch;}
.col{background:color-mix(in srgb,var(--surface) 55%,var(--bg));border:1px solid var(--border);border-radius:18px;padding:10px;min-height:220px;}
.col.over{border-color:var(--rust);background:color-mix(in srgb,var(--rust) 8%,var(--surface));}
.col-h{position:sticky;top:0;z-index:3;background:inherit;border-radius:12px;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font:800 11px 'Nunito Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--tan);}
.col-h .cht{background:none;color:inherit;padding:0;letter-spacing:.12em;cursor:pointer;} .col-h .cht i{font-style:normal;opacity:0;transition:opacity .15s;} .col-h:hover .cht i{opacity:.7;} @media (hover:none){.col-h .cht i{opacity:.6;}}
.col-h span{background:var(--surface-2);color:var(--ink);border-radius:999px;padding:2px 9px;letter-spacing:0;}
.card{background:var(--surface);border:1px solid var(--border-mid);border-radius:14px;padding:10px;margin-bottom:10px;cursor:grab;position:relative;}
.cx{position:relative;z-index:1;width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:var(--surface-2);color:var(--ink-3,#888);font-size:15px;line-height:28px;cursor:pointer;padding:0;}
.cx:hover{background:#fde2e2;color:#c0392b;}
.ctop{padding-right:0;}
.ctop>div:nth-child(2){flex:1;}
.cacts{display:flex;gap:4px;align-self:flex-start;flex-shrink:0;margin:-2px -2px 0 0;}
.card.done{opacity:.55;} .card.dragging{opacity:.4;}
.ctop{display:flex;gap:10px;align-items:center;}
.ctop img,.ctop .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
.cname{font-weight:800;color:var(--ink);font-size:14px;line-height:1.25;}
.cmeta{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px;}
.bd{font:800 9.5px 'Nunito Sans',sans-serif;letter-spacing:.04em;border-radius:999px;padding:3px 8px;}
.bd.promo{background:#D9A441;color:#2a1d07;} .bd.sample{background:#6E5AA8;color:#fff;} .bd.warn{background:transparent;border:1px solid var(--rust);color:var(--rust);} .bd.ok{background:#2E9E5B;color:#fff;}
.takes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.takes label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text);border:1px solid var(--border-mid);border-radius:999px;padding:4px 10px;cursor:pointer;}
.takes input{width:auto;accent-color:#2E9E5B;}
.cbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
html .cbtns .btn{min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;padding:8px 4px;border-radius:999px;line-height:1;height:34px;}
.mv-row{display:none;gap:6px;margin-top:8px;align-items:center;}
.mv{font-size:12px;padding:6px 8px;flex:1;}
.card.dropbefore{box-shadow:0 -3px 0 var(--rust);}
.empty{color:var(--text-muted);font-size:12.5px;text-align:center;padding:24px 8px;border:1px dashed var(--border-mid);border-radius:12px;}
.tabs{display:none;gap:6px;margin-bottom:12px;overflow-x:auto;}
.tab{border:1px solid var(--border-mid);background:transparent;color:var(--text-muted);border-radius:999px;padding:8px 13px;font:800 11px 'Nunito Sans',sans-serif;white-space:nowrap;cursor:pointer;}
.vtabs{display:flex;gap:6px;margin-bottom:12px;}
.vtabs .tab{font-size:12px;padding:9px 16px;}
.tab.on{background:var(--rust);border-color:var(--rust);color:#fff;}
/* modal */
.modal{position:fixed;inset:0;z-index:700;background:rgba(10,8,7,.72);display:none;align-items:center;justify-content:center;padding:18px;}
.modal.open{display:flex;}
.mcard{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border-mid);border-radius:22px;padding:20px;}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.mh h2{font:400 26px 'Cormorant Garamond',serif;color:var(--ink);line-height:1.1;}
.x{background:none;border:none;color:var(--text-muted);font-size:26px;cursor:pointer;line-height:1;}
.mtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.lbl{font:800 10px 'Nunito Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--tan);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;}
.script-view{font-size:17px;line-height:1.7;color:var(--ink);white-space:pre-wrap;background:var(--bg-lift);border:1px solid var(--border);border-radius:14px;padding:14px;}
.shot{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.shot input[type=checkbox]{width:auto;accent-color:#2E9E5B;} .shot span{flex:1;} .shot.done span{text-decoration:line-through;color:var(--text-muted);}
.row{display:flex;gap:8px;align-items:center;}
.pl{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:12px;margin-top:8px;}
.pi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;}
.pi:hover{background:color-mix(in srgb,var(--rust) 12%,var(--surface));} .pi img,.pi .ph{width:30px;height:30px;border-radius:7px;object-fit:cover;background:var(--surface-2);}
.saved{font-size:11.5px;color:#2E9E5B;font-weight:700;}
@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:700px){
  body{padding:16px;padding-top:88px;} h1{font-size:32px;}
  .tabs{display:flex;} .board{grid-template-columns:1fr;} .col{display:none;} .col.show{display:block;}
  .mv-row{display:flex;} .card{cursor:default;}
}
.vmode{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;} .vmode button{border:0;background:none;color:var(--text-muted);font:800 12px 'Nunito Sans',sans-serif;padding:8px 14px;border-radius:9px;cursor:pointer;} .vmode button.on{background:var(--surface);color:var(--rust);box-shadow:0 1px 3px rgba(0,0,0,.2);}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:stretch;}
.wday{background:color-mix(in srgb,var(--surface) 55%,var(--bg));border:1px solid var(--border);border-radius:16px;padding:8px;min-height:260px;}
.wday.today{border-color:var(--tan);} .wday.over{outline:2px dashed var(--tan);}
.wday-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px;cursor:pointer;} .wday-h b{font:800 11px 'Nunito Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--tan);} .wday-h span{font:300 22px 'Cormorant Garamond',serif;color:var(--ink);}
.wcard{display:flex;gap:7px;align-items:center;background:var(--surface);border:1px solid var(--border-mid);border-radius:11px;padding:6px;margin-bottom:6px;cursor:grab;font-size:12px;}
.wcard img,.wcard .ph{width:30px;height:30px;border-radius:7px;object-fit:cover;flex:none;background:var(--surface-2);} .wcard .wn{font-weight:800;color:var(--ink);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;} .wcard .wt{font-size:10.5px;color:var(--text-muted);}
.wcard.done{opacity:.55;} .wsum{font-size:11px;color:var(--text-muted);padding:0 4px 6px;}
@media(max-width:1000px){.week{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:700px){.week{grid-template-columns:1fr;} .wday{min-height:0;}}
.takes label.tdrag{opacity:.4;} .takes label.tover{outline:2px dashed var(--tan);outline-offset:2px;} .takes label{cursor:grab;}
.takes label.has-script{border-color:var(--rust) !important;box-shadow:0 0 0 1px var(--rust) inset;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Film Board</h1><div class="sub" id="sum">Loading…</div></div>
    <div class="bar">
      <div class="dnav"><button onclick="shiftDay(-1)">‹</button><b id="dayLbl" onclick="goToday()" title="Back to today"></b><button onclick="shiftDay(1)">›</button></div>
      <div class="vmode"><button id="vmDay" class="on" onclick="setMode('day')">Day</button><button id="vmWeek" onclick="setMode('week')">Week</button></div>
      <button class="btn" id="moveDayBtn" onclick="moveDay()" title="Move everything on this day to another day">Move day →</button>
      <button class="btn primary" onclick="openAdd()">+ Add product</button>
    </div>
  </div>
  <div class="vtabs" id="vtabs"></div>
  <div class="tabs" id="tabs"></div>
  <div class="board" id="board"></div>
  <div class="week" id="week" style="display:none"></div>
</div>

<div class="modal" id="m" onmousedown="this._down=(event.target===this)" onclick="if(event.target===this&&this._down)closeM();this._down=false"><div class="mcard" id="mc"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=379"></script>
<script src="planner-sync.js?v=238"></script>
<script src="layout.js?v=363"></script>
<script src="celebrate.js?v=338"></script>
<script src="insights.js?v=339"></script>
<script>
const COL_DEFAULT={talking:'🗣 Talking head',vacuum:'🎬 Demo / voiceover',faceless:'✨ Aesthetic / faceless',car:'🚗 Car'};
const COLS=Object.entries(COL_DEFAULT).map(([k,l])=>[k,l]);
let COLNAMES={};
function applyColNames(){ COLS.forEach(c=>{ c[1]=(COLNAMES[c[0]]||'').trim()||COL_DEFAULT[c[0]]; }); }
// rename a column (saved to your account, stays until you change it; blank = back to default)
async function renameCol(k){
  const cur=COLS.find(c=>c[0]===k)[1];
  const v=prompt('Rename this column (leave blank to reset to "'+COL_DEFAULT[k]+'")',cur); if(v===null) return;
  COLNAMES={...COLNAMES,[k]:v.trim()}; if(!v.trim()) delete COLNAMES[k];
  applyColNames(); plannerSet('filmColNames',COLNAMES); render();
}
let USER=null, DAY=new Date(), ROWS=[], PRODS=[], ACCTS={}, META={}, STYLEMEM={}, PROMOS=[], VIEW='todo', MOBILECOL='talking', CUR=null, MTAB='script';
const pad=n=>String(n).padStart(2,'0'), ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CPY=/\[copy:(\w+)\]/;
const keyOf=r=>{ const c=String(r.notes||'').match(CPY); return String(r.prod_id||String(r.name||'').toLowerCase())+(c?'#'+c[1]:''); };
try{ MOBILECOL=localStorage.getItem('take24:filmTab')||'talking'; }catch(e){}

function guessStyle(name,brand){
  const t=(name+' '+brand).toLowerCase();
  if(/vacuum|vac\b|mop|stain|carpet|robot|wet ?dry|steam|shark home|cordless|power detect|hydro|clean/.test(t)) return 'vacuum';
  return 'talking';
}
function groups(){
  const m={}, out=[];
  ROWS.forEach(r=>{ const k=keyOf(r); if(!m[k]){ m[k]={key:k,name:r.name,brand:r.brand,prod_id:r.prod_id,acct:r.tiktok_account_id,rows:[]}; out.push(m[k]); } m[k].rows.push(r); });
  out.forEach(g=>{ g.p=PRODS.find(p=>p.id===g.prod_id)||PRODS.find(p=>String(p.name).toLowerCase()===String(g.name).toLowerCase())||null;
    const meta=META[g.key]||{}; g.meta=meta;
    g.style=meta.style||STYLEMEM[g.prod_id||g.key]||guessStyle(g.name||'',g.brand||g.p?.brand||'');
    g.done=g.rows.every(r=>r.done); });
  return out;
}
function metaSave(k,patch){
  const all={...(META)}; all[k]={...(all[k]||{}),...patch}; META=all;
  const day=ymd(DAY); plannerGet('filmBoard',{}).then(b=>{ b=b||{}; b[day]=META; plannerSet('filmBoard',b); });
}

async function load(){
  document.getElementById('dayLbl').textContent=ymd(DAY)===ymd(new Date())?'Today · '+DAY.toLocaleDateString(undefined,{month:'short',day:'numeric'}):DAY.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const day=ymd(DAY);
  const [{data:rows},board,mem,,promoRes]=await Promise.all([
    db.from('queue').select('*').eq('user_id',USER.id).eq('date',day).order('sort_order').order('id'),
    plannerGet('filmBoard',{}), plannerGet('filmStyleMem',{}), plannerGet('filmColNames',{}).then(v=>{ COLNAMES=v||{}; applyColNames(); }),
    db.from('promos').select('product,deal,start_date,end_date').eq('user_id',USER.id).lte('start_date',day).gte('end_date',day).then(r=>r,()=>({data:[]}))
  ]);
  PROMOS=promoRes?.data||[];
  ROWS=(rows||[]).filter(r=>!/^REMINDER$/m.test(r.notes||'')); META=(board||{})[day]||{}; STYLEMEM=mem||{};
  render();
}
function render(){
  const G=groups();
  const takesTotal=ROWS.length, takesDone=ROWS.filter(r=>r.done).length;
  document.getElementById('sum').textContent=G.length?`${G.length} product${G.length===1?'':'s'} · ${takesDone}/${takesTotal} takes filmed`:'Nothing planned yet — add a product, or plan takes from Home.';
  document.getElementById('tabs').innerHTML=COLS.map(([k,l])=>`<button class="tab${MOBILECOL===k?' on':''}" onclick="setTab('${k}')">${l} (${G.filter(g=>g.style===k&&(VIEW==='done'?g.rows.some(r=>r.done):!g.done)).length})</button>`).join('');
  const nTodo=G.filter(g=>!g.done).length, nDone=G.filter(g=>g.rows.some(r=>r.done)).length;
  document.getElementById('vtabs').innerHTML=`<button class="tab${VIEW==='todo'?' on':''}" onclick="setView('todo')">To film (${nTodo})</button><button class="tab${VIEW==='done'?' on':''}" onclick="setView('done')">✓ Filmed (${nDone})</button>`;
  document.getElementById('board').innerHTML=COLS.map(([k,l])=>{
    const list=colList(G,k).filter(g=>VIEW==='done'?g.rows.some(r=>r.done):!g.done);
    return `<div class="col${MOBILECOL===k?' show':''}" data-col="${k}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropOn(event,'${k}')">
      <div class="col-h"><span class="cht" onclick="renameCol('${k}')" title="Rename column">${esc(l)} <i>✎</i></span><span>${list.length}</span></div>
      ${list.length?list.map(card).join(''):`<div class="empty">${VIEW==='done'?'Nothing filmed here yet':'Drag products here'}</div>`}</div>`;
  }).join('');
}
// is this product on a live promo today (from the Promos page)? loose name match
const normP=t=>String(t||'').toLowerCase().replace(/shark|ninja|beauty|home|®|™/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function promoFor(g){
  const n=normP(g.name); if(!n) return null;
  return PROMOS.find(p=>{ const q=normP(p.product); return q&&(n.includes(q)||q.includes(n)); })||null;
}
function card(g){
  const img=g.p?.image_url, notes=g.rows.map(r=>r.notes||'').join(' ');
  const promo=/Promo:/i.test(notes)||!!promoFor(g), sample=/FREE_SAMPLE/.test(g.p?.notes||'');
  const noScript=g.rows.every(r=>!String(r.script||'').trim());
  const shots=g.meta.shots||[], sDone=shots.filter(s=>s.done).length;
  const acct=ACCTS[g.acct]||'';
  return `<div class="card${g.done?' done':''}" data-key="${esc(g.key)}" draggable="true" ondragstart="dragStart(event,'${esc(g.key)}')" ondragend="this.classList.remove('dragging')" ondragover="this.classList.add('dropbefore')" ondragleave="this.classList.remove('dropbefore')">
    <div class="ctop">${img?`<img src="${esc(img)}" alt="">`:'<span class="ph"></span>'}<div style="min-width:0"><div class="cname"${g.prod_id?` onclick="event.stopPropagation();openScorecard('${g.prod_id}')" title="See this product's scorecard" style="cursor:pointer"`:''}>${esc(g.name)}</div><div class="cmeta">${esc(g.brand||g.p?.brand||'')}</div></div><div class="cacts"><button class="cx" type="button" title="Move to another day" draggable="false" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();openMoveCard('${esc(g.key)}')">📅</button><button class="cx" type="button" title="Remove" draggable="false" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();removeCard('${esc(g.key)}')">×</button></div></div>
    <div class="badges">${promo?'<span class="bd promo">★ Promo</span>':''}${sample?'<span class="bd sample">Free sample</span>':''}${noScript?'<span class="bd warn">No script yet</span>':''}${g.done?'<span class="bd ok">✓ Filmed</span>':''}${shots.length?`<span class="bd" style="background:var(--surface-2);color:var(--ink)">📷 ${sDone}/${shots.length} shots</span>`:''}</div>
    <div class="takes">${g.rows.map((r,i)=>`<label draggable="true" ondragstart="takeDragStart(event,'${r.id}')" ondragend="this.classList.remove('tdrag')" ondragover="takeOver(event)" ondragleave="this.classList.remove('tover')" ondrop="takeDrop(event,'${r.id}')"${String(r.script||'').trim()?' class="has-script" title="Has a script — drag to reorder"':' title="Drag to reorder"'}><input type="checkbox" ${r.done?'checked':''} onchange="toggleTake('${r.id}',this.checked)">Take ${i+1}</label>`).join('')}${g.rows.length>1?`<button class="btn sm" style="padding:4px 10px" title="Remove last take" onclick="removeTake('${esc(g.key)}')">−</button>`:''}<button class="btn sm" style="padding:4px 9px" title="Add a take" onclick="addTake('${esc(g.key)}')">+</button></div>
    <div class="cbtns"><button class="btn sm" onclick="openItem('${esc(g.key)}','script')">Script</button><button class="btn sm" onclick="openItem('${esc(g.key)}','shots')">Shots</button><button class="btn sm" onclick="openItem('${esc(g.key)}','seo')">Extras</button><button class="btn sm" onclick="copyCard('${esc(g.key)}')" title="Make a copy under this one">Copy</button></div>
    <div class="mv-row"><button class="btn sm" onclick="nudge('${esc(g.key)}',-1)" title="Move up">↑</button><button class="btn sm" onclick="nudge('${esc(g.key)}',1)" title="Move down">↓</button>
    <select class="mv" onchange="placeCard('${esc(g.key)}',this.value,null)">${COLS.map(([k,l])=>`<option value="${k}"${g.style===k?' selected':''}>Move to: ${l}</option>`).join('')}</select></div>
  </div>`;
}
function colList(G,k){
  return G.map((g,i)=>({g,i})).filter(x=>x.g.style===k)
    .sort((a,b)=>(a.g.done-b.g.done)||((a.g.meta.order??1e6+a.i)-(b.g.meta.order??1e6+b.i))).map(x=>x.g);
}
// put `k` into column `col`, right before card `beforeKey` (or at the end), and save the new order
function placeCard(k,col,beforeKey){
  const G=groups(); const g=G.find(x=>x.key===k); if(!g) return;
  if(g.style!==col){ if(!k.includes('#')) STYLEMEM[g.prod_id||k]=col; plannerSet('filmStyleMem',STYLEMEM); g.style=col; }
  let list=colList(G.map(x=>x.key===k?{...x,style:col}:x),col).filter(x=>x.key!==k);
  const at=beforeKey?list.findIndex(x=>x.key===beforeKey):-1;
  list.splice(at<0?list.length:at,0,g);
  const all={...META};
  list.forEach((x,i)=>{ all[x.key]={...(all[x.key]||{}),order:i,...(x.key===k?{style:col}:{})}; });
  META=all; const day=ymd(DAY); plannerGet('filmBoard',{}).then(b=>{ b=b||{}; b[day]=META; plannerSet('filmBoard',b); });
  render();
}
function nudge(k,dir){

    db.from('products').select('id,name,brand,image_url,notes,tiktok_account_id').eq('user_id',USER.id).order('name'),
    db.from('tiktok_accounts').select('tiktok_open_id,username,display_name').eq('user_id',USER.id)
  ]);
  PRODS=prods||[]; (accts||[]).forEach(a=>ACCTS[a.tiktok_open_id]='@'+(a.username||a.display_name||'account'));
  try{ await plannerGet('filmColNames',{}).then(v=>{ COLNAMES=v||{}; applyColNames(); }); STYLEMEM=(await plannerGet('filmStyleMem',{}))||{}; }catch(e){}
  setMode(MODE);
})();
</script>
