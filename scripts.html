<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F8F5F1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/pwa/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/pwa/icon-192.png">
<title>Scripts &mdash; Creator Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200;300;400;500;600;700&family=Stack+Sans+Text:wght@200..700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">

<style>

:root{--r:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Serif',serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.page{max-width:1080px;margin:0 auto;padding:0 40px 100px;}
.page-header{padding:44px 0 32px;border-bottom:1px solid var(--border-mid);margin-bottom:32px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.page-eyebrow{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--rust);margin-bottom:10px;}
.page-title{font-family:'IBM Plex Serif',serif;font-size:52px;font-weight:700;line-height:0.9;letter-spacing:-0.02em;color:var(--ink);}
.page-title em{font-style:italic;color:var(--sage);}
.page-sub{font-size:13px;color:var(--text-mid);margin-top:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:0.04em;cursor:pointer;font-family:'Stack Sans Notch',sans-serif;transition:all 0.15s;border:none;text-transform:uppercase;}
.btn-primary{background:var(--rust);color:#fff;}.btn-primary:hover{background:#9a5a57;}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border-mid);}.btn-ghost:hover{background:var(--surface);color:var(--ink);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,39,37,0.4);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-lift);border-radius:16px;padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(42,39,37,0.15);position:relative;}
.modal-title{font-family:'IBM Plex Serif',serif;font-size:26px;font-weight:700;color:var(--ink);margin-bottom:20px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}
.form-row{margin-bottom:16px;}
.form-label{display:block;font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-mid);margin-bottom:6px;}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--border-mid);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;font-family:'IBM Plex Serif',serif;outline:none;transition:border-color 0.15s;}
.form-input:focus{border-color:var(--rose);}
.product-pick-wrap{position:relative;}
.product-pick-list{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);max-height:220px;overflow:auto;border:1px solid var(--border-mid);border-radius:var(--r);background:var(--bg-lift);box-shadow:var(--shadow-md);padding:6px;}
.product-pick-list.open{display:block;}
.product-pick-item{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--text);font-family:'IBM Plex Serif',serif;}
.product-pick-item:hover{background:var(--surface);}
.product-pick-name{font-weight:700;color:var(--ink);font-size:13px;}
.product-pick-brand{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-top:2px;}
.form-textarea{resize:vertical;min-height:80px;}
.form-row-half{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-danger{background:none;border:1px solid rgba(174,105,101,0.3);color:var(--rust);font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:'Stack Sans Notch',sans-serif;transition:all 0.15s;text-transform:uppercase;}
.btn-danger:hover{background:var(--rust);color:#fff;}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.pill{background:var(--surface);border:1px solid var(--border-mid);border-radius:100px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text-mid);transition:all 0.12px;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;}
.pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.pill:hover:not(.active){background:var(--sand);}
.search-box{flex:1;min-width:180px;padding:8px 16px;border:1px solid var(--border-mid);border-radius:100px;background:var(--surface);color:var(--text);font-size:13px;font-family:'IBM Plex Serif',serif;outline:none;}
.search-box:focus{border-color:var(--rose);}
.empty{text-align:center;padding:64px 24px;}
.empty-title{font-family:'IBM Plex Serif',serif;font-size:22px;font-weight:700;color:var(--text-mid);margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--text-muted);line-height:1.7;}
.empty-sub a{color:var(--rust);text-decoration:underline;text-underline-offset:3px;}
footer{border-top:1px solid var(--border);padding:24px 48px;display:flex;align-items:center;justify-content:space-between;}
.footer-brand{font-family:'Stack Sans Notch',sans-serif;font-size:16px;font-weight:700;color:var(--ink);}
.footer-note{font-size:11px;color:var(--text-muted);}
.icon-sm{width:20px;height:20px;object-fit:contain;}
@media(max-width:768px){.page{padding:80px 16px 24px;}.page-title{font-size:40px;}.form-row-half{grid-template-columns:1fr;}}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);transition:all 0.15s;display:flex;flex-direction:column;gap:10px;cursor:pointer;}
.prod-card:hover{border-color:var(--rose);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.prod-brand{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--rust);}
.prod-name{font-family:'IBM Plex Serif',serif;font-size:20px;font-weight:700;color:var(--ink);line-height:1.2;}
.prod-status{display:inline-block;padding:3px 10px;border-radius:100px;font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;align-self:flex-start;}
.status-active{background:rgba(122,129,108,0.15);color:var(--sage);}
.status-paused{background:rgba(165,139,113,0.15);color:var(--tan);}
.status-promote{background:rgba(174,105,101,0.15);color:var(--rust);}
.prod-tags{display:flex;gap:5px;flex-wrap:wrap;}
.prod-tag{background:var(--sand);color:var(--text-mid);border-radius:100px;padding:2px 9px;font-size:11px;}
.prod-notes{font-size:12px;color:var(--text-mid);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}

.script-grid{display:flex;flex-direction:column;gap:12px;}
.script-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow-sm);transition:all 0.12s;position:relative;}
.script-card:hover{border-color:var(--rose);box-shadow:var(--shadow-md);}
.script-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.script-title{font-family:'IBM Plex Serif',serif;font-size:18px;font-weight:700;color:var(--ink);flex:1;line-height:1.2;}
.script-actions{display:flex;gap:6px;flex-shrink:0;}
.script-copy,.script-edit{background:none;border:1px solid var(--border-mid);border-radius:6px;padding:4px 12px;font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:600;cursor:pointer;color:var(--text-mid);transition:all 0.12s;text-transform:uppercase;letter-spacing:0.04em;}
.script-copy:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
.script-copy.copied{background:var(--sage);color:#fff;border-color:var(--sage);}
.script-edit:hover{background:var(--surface-2);color:var(--ink);}
.script-meta{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.script-brand{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--rust);}
.script-cat{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:2px 9px;border-radius:100px;background:var(--sand);color:var(--text-mid);}
.script-date{font-family:'Stack Sans Notch',sans-serif;font-size:11px;color:var(--text-muted);}
.script-body{font-size:13px;color:var(--text-mid);line-height:1.7;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;white-space:pre-wrap;cursor:pointer;}
.view-modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,39,37,0.4);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px;}
.view-modal-overlay.open{display:flex;}
.view-modal{background:var(--bg-lift);border-radius:16px;padding:36px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(42,39,37,0.15);position:relative;}
.view-modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}
.view-modal-title{font-family:'IBM Plex Serif',serif;font-size:28px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.view-modal-meta{font-size:12px;color:var(--text-muted);margin-bottom:24px;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;}
.view-script-body{font-size:15px;line-height:1.9;color:var(--text);white-space:pre-wrap;font-family:'IBM Plex Serif',serif;}
.view-modal-actions{display:flex;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}
.form-script{font-family:'IBM Plex Serif',serif;font-size:13px;line-height:1.8;resize:vertical;min-height:280px;}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;}
.edit-toolbar{display:none;align-items:center;justify-content:space-between;gap:12px;margin:-8px 0 18px;padding:12px 14px;border:1px solid var(--border-mid);border-radius:var(--r);background:var(--surface);}
.edit-toolbar.open{display:flex;}
.edit-count{font-family:'Stack Sans Notch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-mid);}
.edit-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bank-select{display:none;position:absolute;top:22px;left:20px;width:24px;height:24px;border:2px solid var(--border-mid);border-radius:7px;background:var(--bg-lift);align-items:center;justify-content:center;color:#fff;font-family:'Stack Sans Notch',sans-serif;font-size:13px;font-weight:800;}
.script-card.select-mode{padding-left:58px;cursor:pointer;}
.script-card.selected{border-color:var(--rust);box-shadow:0 0 0 3px color-mix(in srgb,var(--rust) 16%,transparent),var(--shadow-sm);}
.script-card.select-mode .bank-select{display:flex;}
.script-card.selected .bank-select{background:var(--rust);border-color:var(--rust);}
.script-card.selected .bank-select::after{content:'✓';}
.script-card.select-mode .script-actions{display:none;}
</style>

<script src="supabase.js?v=110"></script>
</head>
<body>
<nav><a href="index.html" class="nav-brand"><img src="logo.png" alt="Take24" style="height:28px;width:auto;object-fit:contain;display:block;"></a><div class="nav-links"><a href="index.html" class="nav-link">Home</a><a href="daily-todo.html" class="nav-link">To Do</a><a href="products.html" class="nav-link">Products</a><a href="video-tracker.html" class="nav-link">Videos</a><a href="hooks.html" class="nav-link">Hooks</a><a href="scripts.html" class="nav-link active">Scripts</a><a href="sales-calendar.html" class="nav-link">Sales Log</a></div></nav>
<div class="page" style="max-width:900px;">
  <div class="page-header">
    <div><div class="page-eyebrow">Script Library</div><div class="page-title">Saved <em>Scripts</em></div><p class="page-sub">Generate scripts with your AI of choice, then paste and save them here.</p></div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="editScriptsBtn" onclick="toggleScriptEditMode()">Edit Scripts</button>
      <button class="btn btn-primary" onclick="openSaveModal()">+ Add Script</button>
    </div>
  </div>
  <div class="filter-bar">
    <input type="text" class="search-box" id="searchBox" placeholder="Search scripts, products, brands..." oninput="renderScripts()">
    <select class="search-box" id="productFilter" onchange="renderScripts()" aria-label="Filter scripts by product">
      <option value="all">All Products</option>
    </select>
    <div class="pill active" data-f="all" onclick="setFilter(this,'all')">All</div>
    <div class="pill" data-f="review" onclick="setFilter(this,'review')">Review</div>
    <div class="pill" data-f="tutorial" onclick="setFilter(this,'tutorial')">Tutorial</div>
    <div class="pill" data-f="unboxing" onclick="setFilter(this,'unboxing')">Unboxing</div>
    <div class="pill" data-f="storytime" onclick="setFilter(this,'storytime')">Storytime</div>
    <div class="pill" data-f="live" onclick="setFilter(this,'live')">Live</div>
  </div>
  <div class="edit-toolbar" id="scriptEditToolbar">
    <div class="edit-count" id="scriptEditCount">0 selected</div>
    <div class="edit-actions">
      <button class="btn btn-ghost" onclick="selectAllVisibleScripts()">Select All</button>
      <button class="btn btn-ghost" onclick="clearScriptSelection()">Clear</button>
      <button class="btn-danger" id="deleteSelectedScriptsBtn" onclick="deleteSelectedScripts()">Delete Selected</button>
    </div>
  </div>
  <div class="script-grid" id="scriptGrid"><p style="color:var(--text-muted);padding:20px;">Loading...</p></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div class="modal-title" id="modalTitle">Add Script</div>
    <div class="form-row"><label class="form-label">Title *</label><input type="text" class="form-input" id="fTitle" placeholder="e.g. PetLab Dental — This saved my dog's breath"></div>
    <div class="form-row-half">
      <div class="form-row" style="margin-bottom:0">
        <label class="form-label">Product</label>
        <div class="product-pick-wrap">
          <input type="text" class="form-input" id="fBrand" placeholder="Search products..." autocomplete="off" oninput="filterProductPicker()" onfocus="filterProductPicker()">
          <div class="product-pick-list" id="productPickList"></div>
        </div>
      </div>
      <div class="form-row" style="margin-bottom:0"><label class="form-label">Type</label><select class="form-input" id="fCat"><option value="review">Review</option><option value="tutorial">Tutorial</option><option value="unboxing">Unboxing</option><option value="storytime">Storytime</option><option value="live">Live</option></select></div>
    </div>
    <div class="form-row" style="margin-top:16px"><label class="form-label">Script Text *</label><textarea class="form-input form-script" id="fScript" placeholder="Paste your script here..."></textarea></div>
    <div class="form-row"><label class="form-label">Notes (optional)</label><input type="text" class="form-input" id="fNotes" placeholder="e.g. 30s version, hook A"></div>
    <div class="modal-actions"><button class="btn btn-primary" id="saveScriptBtn" style="flex:1;" onclick="saveScript()">Add Script</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="deleteBtn" style="display:none;" onclick="deleteScript()">Delete</button></div>
  </div>
</div>
<div class="view-modal-overlay" id="viewOverlay">
  <div class="view-modal">
    <button class="view-modal-close" onclick="closeView()">&#x2715;</button>
    <div class="view-modal-title" id="viewTitle"></div>
    <div class="view-modal-meta" id="viewMeta"></div>
    <div class="view-script-body" id="viewBody"></div>
    <div class="view-modal-actions">
      <button class="btn btn-primary" id="viewCopyBtn" onclick="copyView()">Copy Script</button>
      <button class="btn btn-ghost" onclick="editFromView()">Edit</button>
      <button class="btn btn-ghost" onclick="closeView()">Close</button>
    </div>
  </div>
</div>
<footer><div class="footer-brand">Creator Hub</div><div class="footer-note">TikTok Shop Creator Workspace</div></footer>
<script src="layout.js?v=110"></script>
<script>
let _editScriptsMode = false;
let _selectedScriptIds = new Set();
let _visibleScriptIds = [];
let _allProducts = [];

async function init() {
  const user = await requireAuth();
  if (!user) return;
  const prefs = await loadUserPrefs(user.id);
  await initDisplayName(user, prefs);
  await initCore5(user.id, prefs);
  await initTheme(user.id, prefs);
  initProfilePopover(user.id);
  
  window._user = user;
  window._filter = 'all';
  window._viewId = null;
  await loadScriptProducts();

  async function loadScriptProducts() {
    const { data } = await db.from('products').select('id,name,brand').eq('user_id', user.id).order('name');
    _allProducts = data || [];
  }

  function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  window.filterProductPicker = function() {
    const input = document.getElementById('fBrand');
    const list = document.getElementById('productPickList');
    if(!input || !list) return;
    const q = input.value.trim().toLowerCase();
    const matches = _allProducts
      .filter(p => !q || `${p.name||''} ${p.brand||''}`.toLowerCase().includes(q))
      .slice(0, 50);
    list.innerHTML = matches.length ? matches.map(p => `
      <button type="button" class="product-pick-item" onclick="selectScriptProduct('${esc(p.id)}')">
        <div class="product-pick-name">${esc(p.name)}</div>
        ${p.brand?`<div class="product-pick-brand">${esc(p.brand)}</div>`:''}
      </button>
    `).join('') : '<div class="empty-sub" style="padding:10px;">No matching products.</div>';
    list.classList.add('open');
  };

  window.selectScriptProduct = function(id) {
    const product = _allProducts.find(p => p.id === id);
    if(!product) return;
    document.getElementById('fBrand').value = product.name || '';
    document.getElementById('productPickList').classList.remove('open');
  };

  async function renderScripts() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const f = window._filter;
    const productFilter = document.getElementById('productFilter');
    const productValue = productFilter?.value || 'all';
    const { data: scripts } = await db.from('scripts').select('*').eq('user_id', user.id).order('created_at', {ascending:false});
    const products = [...new Set((scripts||[]).map(s => (s.brand||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    if(productFilter) {
      productFilter.innerHTML = '<option value="all">All Products</option>' + products.map(product => `<option value="${product.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}">${product.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</option>`).join('');
      productFilter.value = products.includes(productValue) ? productValue : 'all';
    }
    const filtered = (scripts||[]).filter(s => {
      if(f !== 'all' && s.cat !== f) return false;
      if(productFilter?.value !== 'all' && (s.brand||'') !== productFilter.value) return false;
      if(q) return (s.title+(s.brand||'')+(s.script||'')+(s.notes||'')).toLowerCase().includes(q);
      return true;
    });
    _visibleScriptIds = filtered.map(s => s.id);
    const el = document.getElementById('scriptGrid');
    if(!filtered.length){ el.innerHTML='<div class="empty"><div class="empty-title">No scripts yet</div><div class="empty-sub">Generate a script with your AI of choice and paste it here.</div></div>'; updateScriptEditToolbar(); return; }
    el.innerHTML = filtered.map(s => {
      const selected = _selectedScriptIds.has(s.id);
      return '<div class="script-card '+(_editScriptsMode?'select-mode ':'')+(selected?'selected':'')+'" onclick="handleScriptCardClick(\''+s.id+'\')">'+
      '<span class="bank-select" aria-hidden="true"></span>'+
      '<div class="script-top"><div class="script-title">'+s.title+'</div>'+
      '<div class="script-actions">'+
      '<button class="script-copy" onclick="event.stopPropagation();copyScript(\''+s.id+'\',this)">Copy</button>'+
      '<button class="script-edit" onclick="event.stopPropagation();openSaveModal(\''+s.id+'\')">Edit</button>'+
      '</div></div>'+
      '<div class="script-meta">'+
      (s.brand?'<span class="script-brand">'+s.brand+'</span>':'')+
      '<span class="script-cat">'+s.cat+'</span>'+
      '<span class="script-date">'+new Date(s.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</span>'+
      (s.notes?'<span style="font-size:11px;color:var(--text-muted);font-style:italic;font-family:\'IBM Plex Serif\',serif;">'+s.notes+'</span>':'')+
      '</div>'+
      '<div class="script-body" onclick="event.stopPropagation();openView(\''+s.id+'\')">'+s.script+'</div>'+
      '</div>';
    }).join('');
    updateScriptEditToolbar();
  }

  window.renderScripts = renderScripts;
  window.updateScriptEditToolbar = function() {
    const toolbar = document.getElementById('scriptEditToolbar');
    const count = document.getElementById('scriptEditCount');
    const deleteBtn = document.getElementById('deleteSelectedScriptsBtn');
    const editBtn = document.getElementById('editScriptsBtn');
    if(toolbar) toolbar.classList.toggle('open', _editScriptsMode);
    if(count) count.textContent = `${_selectedScriptIds.size} selected`;
    if(deleteBtn) deleteBtn.disabled = _selectedScriptIds.size === 0;
    if(editBtn) editBtn.textContent = _editScriptsMode ? 'Done Editing' : 'Edit Scripts';
  };
  window.toggleScriptEditMode = function() {
    _editScriptsMode = !_editScriptsMode;
    if(!_editScriptsMode) _selectedScriptIds.clear();
    renderScripts();
  };
  window.handleScriptCardClick = function(id) {
    if(!_editScriptsMode) { openView(id); return; }
    if(_selectedScriptIds.has(id)) _selectedScriptIds.delete(id);
    else _selectedScriptIds.add(id);
    renderScripts();
  };
  window.selectAllVisibleScripts = function() {
    _visibleScriptIds.forEach(id => _selectedScriptIds.add(id));
    renderScripts();
  };
  window.clearScriptSelection = function() {
    _selectedScriptIds.clear();
    renderScripts();
  };
  window.deleteSelectedScripts = async function() {
    const ids = Array.from(_selectedScriptIds);
    if(!ids.length) return;
    if(!confirm(`Delete ${ids.length} selected script${ids.length === 1 ? '' : 's'}?`)) return;
    const btn = document.getElementById('deleteSelectedScriptsBtn');
    btn.disabled = true; btn.textContent = 'Deleting...';
    const { error } = await db.from('scripts').delete().in('id', ids).eq('user_id', user.id);
    if(error) {
      showToast(error.message, 'error');
      btn.disabled = false; btn.textContent = 'Delete Selected';
      return;
    }
    showToast(`${ids.length} script${ids.length === 1 ? '' : 's'} deleted`);
    _selectedScriptIds.clear();
    _editScriptsMode = false;
    btn.textContent = 'Delete Selected';
    renderScripts();
  };
  window.setFilter = function(el, f) { window._filter=f; document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.dataset.f===f)); renderScripts(); };
  window.openSaveModal = async function(id) {
    window._editId = id || null;
    const s = id ? (await db.from('scripts').select('*').eq('id',id).single()).data : null;
    document.getElementById('modalTitle').textContent = s ? 'Edit Script' : 'Add Script';
    document.getElementById('saveScriptBtn').textContent = s ? 'Save Changes' : 'Add Script';
    document.getElementById('fTitle').value = s?.title || '';
    document.getElementById('fBrand').value = s?.brand || '';
    document.getElementById('fCat').value = s?.cat || 'review';
    document.getElementById('fScript').value = s?.script || '';
    document.getElementById('fNotes').value = s?.notes || '';
    document.getElementById('deleteBtn').style.display = s ? '' : 'none';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('fTitle').focus(), 100);
  };
  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('open'); };
  window.saveScript = async function() {
    const title = document.getElementById('fTitle').value.trim();
    const script = document.getElementById('fScript').value.trim();
    if(!title||!script) { (!title?document.getElementById('fTitle'):document.getElementById('fScript')).focus(); return; }
    const row = { user_id: user.id, title, brand: document.getElementById('fBrand').value.trim(), cat: document.getElementById('fCat').value, script, notes: document.getElementById('fNotes').value.trim() };
    if(window._editId) { await db.from('scripts').update(row).eq('id', window._editId); }
    else { await db.from('scripts').insert(row); }
    showToast(window._editId?'Script updated':'Script saved');
    window.closeModal(); renderScripts();
  };
  window.deleteScript = async function() {
    if(!confirm('Delete this script?')) return;
    await db.from('scripts').delete().eq('id', window._editId).eq('user_id', user.id);
    showToast('Deleted'); window.closeModal(); renderScripts();
  };
  window.copyScript = async function(id, btn) {
    const { data } = await db.from('scripts').select('script').eq('id',id).single();
    if(data) { navigator.clipboard.writeText(data.script).then(()=>{ btn.textContent='Copied!'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},2000); }); }
  };
  window.openView = async function(id) {
    window._viewId = id;
    const { data: s } = await db.from('scripts').select('*').eq('id',id).single();
    if(!s) return;
    document.getElementById('viewTitle').textContent = s.title;
    document.getElementById('viewMeta').textContent = [s.brand,s.cat,s.notes].filter(Boolean).join(' · ');
    document.getElementById('viewBody').textContent = s.script;
    document.getElementById('viewOverlay').classList.add('open');
  };
  window.closeView = function() { document.getElementById('viewOverlay').classList.remove('open'); window._viewId=null; };
  window.copyView = async function() {
    const { data } = await db.from('scripts').select('script').eq('id',window._viewId).single();
    if(data) { navigator.clipboard.writeText(data.script).then(()=>{ const b=document.getElementById('viewCopyBtn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy Script',2000); }); }
  };
  window.editFromView = function() { const id=window._viewId; closeView(); openSaveModal(id); };
  document.getElementById('modalOverlay').addEventListener('keydown',e=>enterSaves(e,window.saveScript));
  document.getElementById('viewOverlay').addEventListener('click',function(e){if(e.target===this)window.closeView();});
  document.addEventListener('click',e=>{if(!e.target.closest?.('.product-pick-wrap'))document.getElementById('productPickList')?.classList.remove('open');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')window.closeView();});
  await renderScripts();

}
init();
</script>
</body>
</html>
