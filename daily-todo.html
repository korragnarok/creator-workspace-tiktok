<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C2130">
<title>Daily To Do — Creator Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200;300;400;500;600;700&family=Stack+Sans+Text:wght@200..700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
<script src="theme-init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creator Hub">
<link rel="apple-touch-icon" href="icons/pwa/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Serif',serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}

nav{position:sticky;top:0;z-index:200;background:color-mix(in srgb,var(--bg) 88%,#000 12%);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 48px;height:64px;display:flex;align-items:center;}
.nav-brand{font-family:'Stack Sans Notch',sans-serif;font-size:22px;font-weight:700;color:var(--ink);margin-right:48px;}
.nav-links{display:flex;gap:32px;flex:1;align-items:center;}
.nav-link{font-family:'Stack Sans Notch',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-mid);transition:color 0.15s;}
.nav-link:hover{color:var(--ink);}
.nav-link.active{color:var(--rust);}

.desktop-sidebar{display:none;position:fixed;top:0;left:0;width:188px;height:100vh;border-right:1px solid var(--border);background:color-mix(in srgb,var(--bg) 82%,#000 18%);padding:20px 14px;z-index:260;flex-direction:column;gap:16px;overflow-y:auto;}
.side-brand{font-family:'Stack Sans Notch',sans-serif;font-size:31px;font-weight:800;line-height:0.92;color:var(--ink);}
.side-brand span{display:block;font-family:'IBM Plex Serif',serif;font-size:22px;font-weight:400;color:var(--rust);line-height:1.2;}
.side-nav{display:flex;flex-direction:column;gap:6px;}
.side-link{display:flex;align-items:center;gap:12px;border-radius:8px;padding:8px 12px;color:var(--text-mid);font-weight:700;transition:background 0.15s,color 0.15s;}
.side-link.active{background:color-mix(in srgb,var(--rust) 26%,var(--surface) 74%);color:var(--ink);}
.side-link:hover{background:color-mix(in srgb,var(--surface) 78%,var(--rust) 22%);color:var(--ink);}
.nav-icon{width:28px;height:28px;border:1px solid var(--border-mid);border-radius:8px;background:color-mix(in srgb,var(--surface) 78%,var(--bg) 22%);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-icon img{width:19px;height:19px;object-fit:contain;}
.core-sidebar{border:1px solid var(--border-mid);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--surface) 74%,var(--bg) 26%);display:flex;flex-direction:column;gap:8px;}
.core-sidebar-head{display:flex;align-items:center;justify-content:space-between;color:var(--rust);font-size:15px;}
.core-sidebar-head span:first-child{font-weight:700;}
.core-sidebar-count{font-family:'Noto Sans Mono',sans-serif;font-size:10px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--sage) 24%,var(--surface) 76%);border:1px solid var(--border-mid);border-radius:999px;padding:3px 7px;}
.core-mini-list{display:flex;flex-direction:column;gap:6px;}
.core-mini-item{display:block;}
.core-mini-num{display:none;}
.core-mini-input{display:none;}
.core-pill{min-width:0;width:100%;border:1px solid var(--border-mid);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:border-color 0.15s,opacity 0.15s;background:color-mix(in srgb,var(--surface) 75%,var(--sand) 25%);display:flex;align-items:center;}
.core-pill:hover{border-color:var(--rust);}
.core-pill-empty{opacity:0.45;cursor:pointer;}
.core-pill-empty:hover{opacity:0.7;border-color:var(--rust);}
.core-pill-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.core-pill-empty .core-pill-text{color:var(--text-muted);font-style:italic;}
.core-mini-item:nth-child(1) .core-mini-input{background:color-mix(in srgb,var(--rust) 34%,var(--surface) 66%);}
.core-mini-item:nth-child(2) .core-mini-input{background:color-mix(in srgb,var(--sage) 34%,var(--surface) 66%);}
.core-mini-item:nth-child(3) .core-mini-input{background:color-mix(in srgb,var(--tan) 34%,var(--surface) 66%);}
.core-mini-item:nth-child(4) .core-mini-input{background:color-mix(in srgb,var(--sand) 52%,var(--surface) 48%);}
.core-mini-item:nth-child(5) .core-mini-input{background:color-mix(in srgb,var(--rose) 34%,var(--surface) 66%);}


.side-profile{margin-top:auto;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--surface) 76%,var(--bg) 24%);padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color 0.15s;flex-shrink:0;}
.side-profile:hover{border-color:var(--rust);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sage);color:var(--bg);font-family:'Stack Sans Notch',sans-serif;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.avatar-img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-weight:700;line-height:1.1;color:var(--ink);}
.profile-role{font-size:11px;color:var(--text-muted);}

.page{max-width:820px;margin:0 auto;padding:0 40px 100px;}
.page-header{padding:40px 0 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.page-eyebrow{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--rust);margin-bottom:10px;}
.page-title{font-family:'IBM Plex Serif',serif;font-size:48px;font-weight:700;line-height:0.95;letter-spacing:-0.02em;color:var(--ink);}
.page-title em{font-style:italic;color:var(--sage);}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-top:44px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-family:'Stack Sans Notch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border:none;transition:all 0.15s;}
.btn-primary{background:var(--rust);color:#fff;}
.btn-primary:hover{opacity:0.88;}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border-mid);}
.btn-ghost:hover{background:var(--surface);color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-xs{padding:4px 9px;font-size:10px;}

.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.date-arrow{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:7px 14px;font-size:16px;cursor:pointer;color:var(--text-mid);transition:all 0.12s;}
.date-arrow:hover{border-color:var(--rust);color:var(--rust);}
.date-label{font-family:'Stack Sans Notch',sans-serif;font-size:13px;font-weight:700;color:var(--ink);min-width:200px;text-align:center;cursor:pointer;}
.date-badge{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--rust);background:color-mix(in srgb,var(--rust) 12%,transparent);padding:3px 10px;border-radius:100px;}

.progress-summary{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.progress-text{font-family:'Stack Sans Notch',sans-serif;font-size:13px;font-weight:700;color:var(--ink);}
.progress-text span{color:var(--rust);}
.progress-pills{display:flex;gap:8px;}
.progress-pill{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 14px;border-radius:100px;border:1px solid var(--border-mid);}
.pill-filmed{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--sage);border-color:color-mix(in srgb,var(--sage) 28%,transparent);}
.pill-remaining{background:color-mix(in srgb,var(--rust) 14%,transparent);color:var(--rust);border-color:color-mix(in srgb,var(--rust) 24%,transparent);}
.progress-bar-wrap{width:100%;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex-basis:100%;}
.progress-bar-fill{height:100%;background:var(--rust);border-radius:2px;transition:width 0.4s ease;}

.brand-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.brand-pill{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;border-radius:100px;border:1px solid var(--border-mid);background:var(--surface);color:var(--text-mid);cursor:pointer;transition:all 0.12s;}
.brand-pill:hover{border-color:var(--rust);color:var(--rust);}
.brand-pill.active{background:var(--rust);color:#fff;border-color:var(--rust);}

.empty-state{text-align:center;padding:64px 24px;}
.empty-title{font-family:'IBM Plex Serif',serif;font-size:28px;font-weight:700;color:var(--text-mid);margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6;}

.cards-list{display:flex;flex-direction:column;gap:14px;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.pcard-header{background:color-mix(in srgb,var(--surface) 55%,var(--bg) 45%);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);}
.pcard-name{font-family:'Stack Sans Notch',sans-serif;font-size:15px;font-weight:800;color:var(--ink);}
.pcard-brand{font-size:11px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.07em;text-transform:uppercase;margin-top:2px;}
.pcard-btns{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.hbtn{background:color-mix(in srgb,var(--surface) 68%,var(--bg) 32%);border:1px solid var(--border-mid);border-radius:6px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.12s;}
.hbtn:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
.hbtn.danger:hover{background:rgba(180,50,40,0.15);color:#c83c32;border-color:rgba(180,50,40,0.3);}

.takes-wrap{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.take-card{background:color-mix(in srgb,var(--bg) 55%,var(--surface) 45%);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:opacity 0.15s;}
.take-card.done{opacity:0.5;}
.take-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.take-num{color:var(--rust);}

.hook-display{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:10px 14px;font-size:13px;font-style:italic;color:var(--text-mid);line-height:1.5;margin-bottom:10px;border-left:3px solid var(--rust);cursor:pointer;transition:border-color 0.12s;}
.hook-display:hover{border-color:color-mix(in srgb,var(--rust) 70%,transparent);}
.hook-actions{margin-bottom:10px;}

.script-display{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.75;color:var(--text);border-left:3px solid var(--sage);margin-bottom:8px;}
.script-textarea{width:100%;padding:10px 12px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.75;font-family:'IBM Plex Serif',serif;outline:none;resize:vertical;min-height:100px;transition:border-color 0.15s;}
.script-textarea:focus{border-color:var(--rust);}
.script-actions{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}

.insp-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.insp-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.insp-links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.insp-link{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border-mid);border-radius:100px;color:var(--rust);font-size:11px;font-weight:600;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;max-width:200px;transition:border-color 0.12s;}
.insp-link:hover{border-color:var(--rust);}
.insp-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.insp-remove{background:none;border:none;color:var(--text-muted);font-size:14px;line-height:1;cursor:pointer;padding:0;transition:color 0.12s;}
.insp-remove:hover{color:#c83c32;}
.insp-add{display:flex;gap:6px;}
.insp-input{flex:1;min-width:0;padding:7px 11px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;font-family:'IBM Plex Serif',serif;outline:none;transition:border-color 0.15s;}
.insp-input::placeholder{color:var(--text-muted);}
.insp-input:focus{border-color:var(--rust);}
.insp-add-btn{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;color:var(--text-mid);cursor:pointer;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;transition:all 0.12s;}
.insp-add-btn:hover{background:var(--rust);border-color:var(--rust);color:#fff;}

.take-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.take-status{font-family:'Stack Sans Notch',sans-serif;font-size:11px;color:var(--text-muted);}
.take-status.filmed{color:var(--sage);}
.take-footer-btns{display:flex;gap:6px;}
.tbtn{background:none;border:1px solid var(--border-mid);border-radius:6px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.12s;white-space:nowrap;}
.tbtn:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
.tbtn.done-active{background:color-mix(in srgb,var(--sage) 18%,transparent);color:var(--sage);border-color:color-mix(in srgb,var(--sage) 28%,transparent);}
.tbtn.del:hover{background:rgba(180,50,40,0.12);color:#c83c32;border-color:rgba(180,50,40,0.25);}
.add-take-btn{width:100%;background:none;border:1px dashed var(--border-mid);border-radius:10px;padding:9px;font-size:11px;color:var(--text-muted);cursor:pointer;font-family:'Stack Sans Notch',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.12s;}
.add-take-btn:hover{border-color:var(--rust);color:var(--rust);}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:400;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--border-mid);padding:24px;width:100%;max-width:560px;max-height:88vh;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.3);display:flex;flex-direction:column;}
.modal-title{font-family:'IBM Plex Serif',serif;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;}
.modal-search{width:100%;padding:10px 14px;border:1px solid var(--border-mid);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:'IBM Plex Serif',serif;outline:none;margin-bottom:12px;}
.modal-search:focus{border-color:var(--rust);}
.modal-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:0;}
.modal-footer{display:flex;gap:8px;margin-top:16px;flex-shrink:0;}
.modal-cancel{flex:1;background:var(--bg);border:1px solid var(--border-mid);border-radius:10px;padding:12px;font-size:12px;cursor:pointer;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.modal-confirm{flex:2;background:var(--rust);border:none;border-radius:10px;padding:12px;font-size:12px;cursor:pointer;color:#fff;font-family:'Stack Sans Notch',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.modal-confirm:hover{opacity:0.88;}
.modal-confirm:disabled{opacity:0.5;cursor:not-allowed;}

.picker-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:1px solid var(--border);cursor:pointer;background:var(--bg);transition:all 0.12s;}
.picker-item:hover{border-color:var(--rust);}
.picker-item.selected{border-color:var(--rust);background:color-mix(in srgb,var(--rust) 8%,var(--surface) 92%);}
.picker-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;transition:all 0.12s;}
.picker-item.selected .picker-check{background:var(--rust);border-color:var(--rust);}
.picker-name{font-size:13px;font-weight:600;color:var(--ink);}
.picker-meta{font-size:11px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;margin-top:2px;}

.hook-cat-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);padding:2px 4px;margin-top:6px;}
.hook-item{padding:10px 14px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--text-mid);line-height:1.5;background:var(--bg);transition:all 0.12s;}
.hook-item:hover{border-color:var(--rust);color:var(--ink);}
.custom-hook-area{background:color-mix(in srgb,var(--bg) 60%,var(--surface) 40%);border:1px solid var(--border-mid);border-radius:10px;padding:12px;margin-bottom:12px;}
.custom-hook-area label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:8px;}
.custom-hook-row{display:flex;gap:8px;}
.custom-hook-input{flex:1;min-height:64px;padding:9px 12px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:'IBM Plex Serif',serif;outline:none;resize:none;line-height:1.45;}
.custom-hook-input:focus{border-color:var(--rust);}
.custom-hook-save{background:var(--rust);border:none;border-radius:8px;padding:10px 12px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;align-self:flex-end;}

.script-pick-item{padding:12px 14px;border-radius:10px;border:1px solid var(--border);cursor:pointer;background:var(--bg);transition:all 0.12s;}
.script-pick-item:hover{border-color:var(--rust);}
.script-pick-brand{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--rust);margin-bottom:3px;}
.script-pick-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.script-pick-preview{font-size:12px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 88%,#000 12%);backdrop-filter:blur(20px);border-top:1px solid var(--border);height:64px;z-index:300;align-items:stretch;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;transition:color 0.15s;padding-bottom:4px;border:0;background:transparent;cursor:pointer;}
.tab-item.active{color:var(--rust);}
.tab-icon-img{width:22px;height:22px;object-fit:contain;display:block;}
.tab-profile-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;background:var(--sage);display:flex;align-items:center;justify-content:center;}

@media(min-width:769px){body{padding-left:188px;}.desktop-sidebar{display:flex;}nav{padding:0 24px;justify-content:flex-end;}.nav-brand,.nav-links{display:none;}}
@media(max-width:768px){nav{padding:0 20px;}.nav-links{display:none;}.page{padding:0 16px 90px;}.page-title{font-size:36px;}.tab-bar{display:flex;}.modal{max-height:calc(100dvh - 40px);}.modal-list{flex:1;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">Creator Hub</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="daily-todo.html" class="nav-link active">To Do</a>
    <a href="products.html" class="nav-link">Products</a>
    <a href="video-tracker.html" class="nav-link">Videos</a>
    <a href="hooks.html" class="nav-link">Hooks</a>
    <a href="scripts.html" class="nav-link">Scripts</a>
    <a href="sales-calendar.html" class="nav-link">Sales Log</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-eyebrow">Daily Workflow</div>
      <div class="page-title">Today's <em>To Do</em></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="copyAllScripts(this)">📋 Copy All</button>
      <button class="btn btn-primary" onclick="openPicker()">+ Add Task</button>
    </div>
  </div>

  <div class="date-nav">
    <button class="date-arrow" onclick="changeDay(-1)">‹</button>
    <div class="date-label" id="dateLabel" onclick="goToToday()"></div>
    <button class="date-arrow" onclick="changeDay(1)">›</button>
    <span class="date-badge" id="dateBadge" style="display:none;"></span>
  </div>

  <div id="progressArea"></div>
  <div id="brandFilterArea"></div>
  <div id="mainContent"><div style="text-align:center;padding:60px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;font-size:12px;letter-spacing:0.1em;">Loading...</div></div>
</div>

<!-- PRODUCT PICKER -->
<div class="modal-overlay" id="pickerModal">
  <div class="modal">
    <div class="modal-title">What are you filming today?</div>
    <div class="modal-sub">Select one or more products — each gets its own card.</div>
    <input type="text" class="modal-search" id="pickerSearch" placeholder="Search products..." oninput="filterPicker()">
    <div class="modal-list" id="pickerList"></div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closePicker()">Cancel</button>
      <button class="modal-confirm" id="pickerConfirmBtn" onclick="addSelectedProducts()">Add Selected</button>
    </div>
  </div>
</div>

<!-- HOOK PICKER -->
<div class="modal-overlay" id="hookModal">
  <div class="modal">
    <div class="modal-title">Choose a Hook</div>
    <div class="modal-sub" id="hookModalSub"></div>
    <div class="custom-hook-area">
      <label>Custom hook</label>
      <div class="custom-hook-row">
        <textarea class="custom-hook-input" id="customHookInput" placeholder="Type or paste your own hook..."></textarea>
        <button class="custom-hook-save" onclick="saveCustomHook()">Use</button>
      </div>
    </div>
    <input type="text" class="modal-search" id="hookSearch" placeholder="Search hooks..." oninput="filterHooks()">
    <div class="modal-list" id="hookList"></div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeHookModal()">Close</button>
    </div>
  </div>
</div>

<!-- SCRIPT PICKER -->
<div class="modal-overlay" id="scriptModal">
  <div class="modal">
    <div class="modal-title">Choose a Script</div>
    <div class="modal-sub" id="scriptModalSub"></div>
    <input type="text" class="modal-search" id="scriptSearch" placeholder="Search scripts..." oninput="filterScripts()">
    <div class="modal-list" id="scriptList"></div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeScriptModal()">Close</button>
    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
let _user = null;
let ALL_PRODUCTS = [], ALL_HOOKS = [], ALL_SCRIPTS = [];
let TODO = [];
let activeBrandFilter = 'All';
let pickerSelected = new Set();
let hookTarget = null;
let scriptTarget = null;

const today = new Date();
let currentDate = new Date(today);

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayKey = dateKey(today);
function currentKey(){return dateKey(currentDate);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function getLinkLabel(url){try{const u=new URL(url);return u.hostname.replace(/^www\./,'')+(u.pathname.length>1?u.pathname.slice(0,18):'');}catch(e){return url.replace(/^https?:\/\//,'').slice(0,28);}}
function normalizeUrl(url){const t=(url||'').trim();if(!t)return '';return /^https?:\/\//i.test(t)?t:'https://'+t;}

// ─── DATE NAV ─────────────────────────────────────────────
function updateDateDisplay(){
  const key=currentKey(),isToday=key===todayKey;
  document.getElementById('dateLabel').textContent=currentDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const badge=document.getElementById('dateBadge');
  if(isToday){badge.style.display='none';}
  else{badge.style.display='inline-block';badge.textContent=key>todayKey?'Future':'Past';}
}
function changeDay(dir){currentDate=new Date(currentDate);currentDate.setDate(currentDate.getDate()+dir);updateDateDisplay();loadQueue().then(render);}
function goToToday(){if(currentKey()===todayKey)return;currentDate=new Date(today);updateDateDisplay();loadQueue().then(render);}

// ─── DATA ─────────────────────────────────────────────────
async function loadProducts(){const{data}=await db.from('products').select('id,name,brand,link,notes').eq('user_id',_user.id).order('name');ALL_PRODUCTS=data||[];}
async function loadHooks(){const{data}=await db.from('hooks').select('id,text,cat').eq('user_id',_user.id).order('cat');ALL_HOOKS=data||[];}
async function loadScripts(){const{data}=await db.from('scripts').select('id,title,brand,script').eq('user_id',_user.id).order('title');ALL_SCRIPTS=data||[];}

async function loadQueue(){
  const{data}=await db.from('queue').select('*').eq('user_id',_user.id).eq('date',currentKey()).order('sort_order');
  const cardMap={};
  (data||[]).forEach(row=>{
    const key=row.prod_id||('_n_'+row.name);
    if(!cardMap[key])cardMap[key]={id:'c-'+key,prodId:row.prod_id,name:row.name,brand:row.brand||'',script:'',takes:[]};
    cardMap[key].takes.push({id:'t-'+row.id,queueId:row.id,hookText:row.notes||'',script:'',inspirationLinks:[],done:row.done,sortOrder:row.sort_order,editingScript:false});
  });
  TODO=Object.values(cardMap);
  TODO.forEach(card=>{
    const s=sessionStorage.getItem('script-'+card.id+'-'+currentKey());
    if(s)card.script=s;
    card.takes.forEach(take=>{const ts=sessionStorage.getItem('ts-'+take.queueId);if(ts)take.script=ts;});
  });
}

async function saveQueueRow(card,take){
  const payload={user_id:_user.id,date:currentKey(),prod_id:card.prodId||null,name:card.name,brand:card.brand||'',notes:take.hookText||'',done:take.done||false,sort_order:take.sortOrder||0};
  if(take.queueId){await db.from('queue').update(payload).eq('id',take.queueId);}
  else{const{data}=await db.from('queue').insert(payload).select('id').single();if(data)take.queueId=data.id;}
}
async function deleteQueueRow(take){if(take.queueId){await db.from('queue').delete().eq('id',take.queueId);sessionStorage.removeItem('ts-'+take.queueId);}}

// ─── RENDER ───────────────────────────────────────────────
function getFilteredCards(){return activeBrandFilter==='All'?TODO:TODO.filter(c=>(c.brand||'')=== activeBrandFilter);}

function render(){
  const allTakes=TODO.flatMap(c=>c.takes),done=allTakes.filter(t=>t.done).length,total=allTakes.length;
  const pArea=document.getElementById('progressArea');
  if(total>0){
    pArea.innerHTML=`<div class="progress-summary">
      <div class="progress-text"><span>${done}/${total}</span> takes done today</div>
      <div class="progress-pills"><span class="progress-pill pill-filmed">${done} Filmed</span><span class="progress-pill pill-remaining">${total-done} Remaining</span></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${total?(done/total*100):0}%"></div></div>
    </div>`;
  } else pArea.innerHTML='';

  const brands=[...new Set(TODO.map(c=>c.brand).filter(Boolean))].sort();
  const fArea=document.getElementById('brandFilterArea');
  if(brands.length>1){
    fArea.innerHTML=`<div class="brand-filter"><button class="brand-pill${activeBrandFilter==='All'?' active':''}" onclick="setBrandFilter('All')">All</button>${brands.map(b=>`<button class="brand-pill${activeBrandFilter===b?' active':''}" onclick="setBrandFilter('${esc(b)}')">${esc(b)}</button>`).join('')}</div>`;
  } else fArea.innerHTML='';

  const main=document.getElementById('mainContent');
  const filtered=getFilteredCards();
  if(!TODO.length){
    main.innerHTML=`<div class="empty-state"><div class="empty-title">Nothing planned yet</div><div class="empty-sub">Tap "+ Add Task" to pick products you're filming today.</div><button class="btn btn-primary" onclick="openPicker()">+ Add Task</button></div>`;
    return;
  }
  if(!filtered.length){
    main.innerHTML=`<div class="empty-state" style="padding:40px 24px;"><div class="empty-title">No ${esc(activeBrandFilter)} products today</div><button class="btn btn-ghost" onclick="setBrandFilter('All')" style="margin-top:12px;">Show All</button></div>`;
    return;
  }

  let html='<div class="cards-list">';
  filtered.forEach(card=>{
    const takes=card.takes||[],doneTakes=takes.filter(t=>t.done).length;
    html+=`<div class="pcard" id="${esc(card.id)}">
      <div class="pcard-header">
        <div><div class="pcard-name">${esc(card.name)}</div>${card.brand?`<div class="pcard-brand">${esc(card.brand)}</div>`:''}</div>
        <div class="pcard-btns">
          <span style="font-family:'Noto Sans Mono',sans-serif;font-size:11px;color:var(--text-muted);padding:0 4px;">${doneTakes}/${takes.length}</span>
          <button class="hbtn danger" onclick="removeCard('${esc(card.id)}')">Remove</button>
        </div>
      </div>
      <div class="takes-wrap">`;

    takes.forEach((take,i)=>{
      html+=`<div class="take-card${take.done?' done':''}" id="${esc(take.id)}">
        <div class="take-label"><span class="take-num">Take${takes.length>1?' '+(i+1):''}</span>${take.done?'<span style="color:var(--sage);font-size:10px;">✓ Filmed</span>':''}</div>`;

      if(take.hookText){html+=`<div class="hook-display" onclick="openHookModal('${esc(card.id)}','${esc(take.id)}')">${esc(take.hookText)}</div>`;}
      else{html+=`<div class="hook-actions"><button class="tbtn" onclick="openHookModal('${esc(card.id)}','${esc(take.id)}')">+ Add Hook</button></div>`;}

      html+=`<div class="script-actions">`;
      if(take.script)html+=`<button class="btn btn-ghost btn-xs js-copy-take-script" data-cid="${esc(card.id)}" data-tid="${esc(take.id)}">Copy</button>`;
      html+=`<button class="btn btn-ghost btn-xs js-toggle-script-edit" data-cid="${esc(card.id)}" data-tid="${esc(take.id)}">${take.script?(take.editingScript?'Cancel':'Edit Script'):'Paste Script'}</button>
        <button class="btn btn-ghost btn-xs" onclick="openScriptModal('${esc(card.id)}','${esc(take.id)}')">${take.script?'Swap':'Browse Scripts'}</button>
      </div>`;

      if(take.editingScript){
        html+=`<textarea class="script-textarea" id="sta-${esc(take.id)}" placeholder="Paste or type your script...">${esc(take.script)}</textarea>
          <div style="display:flex;gap:6px;margin-top:6px;">
            <button class="btn btn-ghost btn-xs js-cancel-script-edit" data-cid="${esc(card.id)}" data-tid="${esc(take.id)}">Cancel</button>
            <button class="btn btn-primary btn-xs js-save-script-edit" data-cid="${esc(card.id)}" data-tid="${esc(take.id)}">Save</button>
          </div>`;
      } else if(take.script){
        html+=`<div class="script-display">${esc(take.script).replace(/\n/g,'<br>')}</div>`;
      }

      html+=`<div class="insp-section">
        <div class="insp-label">Inspiration</div>
        <div class="insp-links">${(take.inspirationLinks||[]).map((url,li)=>`<a href="${esc(url)}" target="_blank" rel="noopener" class="insp-link"><span>${esc(getLinkLabel(url))}</span></a><button class="insp-remove" onclick="removeInspirationLink('${esc(card.id)}','${esc(take.id)}',${li})">×</button>`).join('')}</div>
        <div class="insp-add">
          <input type="url" class="insp-input" id="insp-${esc(take.id)}" placeholder="Paste a TikTok or inspo link..." onkeydown="if(event.key==='Enter'){event.preventDefault();addInspirationLink('${esc(card.id)}','${esc(take.id)}');}">
          <button class="insp-add-btn" onclick="addInspirationLink('${esc(card.id)}','${esc(take.id)}')">Add</button>
        </div>
      </div>`;

      html+=`<div class="take-footer">
        <span class="take-status${take.done?' filmed':''}">${take.done?'✓ Done':'Not filmed yet'}</span>
        <div class="take-footer-btns">
          <button class="tbtn${take.done?' done-active':''}" onclick="toggleDone('${esc(card.id)}','${esc(take.id)}')">${take.done?'Undo':'Mark Done'}</button>
          ${takes.length>1?`<button class="tbtn del" onclick="removeTake('${esc(card.id)}','${esc(take.id)}')">Remove</button>`:''}
        </div>
      </div></div>`;
    });

    html+=`<button class="add-take-btn" onclick="addTake('${esc(card.id)}')">+ Add Take</button></div></div>`;
  });

  html+='</div>';
  main.innerHTML=html;
}

function setBrandFilter(b){activeBrandFilter=b;render();}

// ─── ACTIONS ──────────────────────────────────────────────
async function removeCard(cardId){
  const card=TODO.find(c=>c.id===cardId);
  if(!card||!confirm('Remove this product and all its takes?'))return;
  for(const take of card.takes)await deleteQueueRow(take);
  TODO=TODO.filter(c=>c.id!==cardId);render();
}
async function addTake(cardId){
  const card=TODO.find(c=>c.id===cardId);if(!card)return;
  const take={id:'t-'+uid(),queueId:null,hookText:'',script:'',inspirationLinks:[],done:false,sortOrder:card.takes.length,editingScript:false};
  card.takes.push(take);render();await saveQueueRow(card,take);
}
async function removeTake(cardId,takeId){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  if(!take)return;await deleteQueueRow(take);card.takes=card.takes.filter(t=>t.id!==takeId);render();
}
async function toggleDone(cardId,takeId){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  if(!take)return;take.done=!take.done;render();
  if(take.queueId)await db.from('queue').update({done:take.done}).eq('id',take.queueId);
}
function copyAllScripts(btn){
  const all=[];TODO.forEach(card=>card.takes.forEach((take,i)=>{if(take.script)all.push(`${card.name.toUpperCase()}${card.takes.length>1?' — Take '+(i+1):''}\n${take.script}`);}));
  if(!all.length){showToast('No scripts yet!');return;}
  navigator.clipboard.writeText(all.join('\n\n---\n\n')).then(()=>{btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='📋 Copy All',2000);showToast(`Copied ${all.length} script${all.length>1?'s':''}`);});
}

function addInspirationLink(cardId,takeId){
  const input=document.getElementById('insp-'+takeId);if(!input)return;
  const url=normalizeUrl(input.value);if(!url)return;
  const take=TODO.find(c=>c.id===cardId)?.takes.find(t=>t.id===takeId);if(!take)return;
  take.inspirationLinks=[...(take.inspirationLinks||[]),url];input.value='';render();
}
function removeInspirationLink(cardId,takeId,index){
  const take=TODO.find(c=>c.id===cardId)?.takes.find(t=>t.id===takeId);if(!take)return;
  take.inspirationLinks=(take.inspirationLinks||[]).filter((_,i)=>i!==index);render();
}

// ─── DELEGATED EVENTS ─────────────────────────────────────
document.body.addEventListener('click',e=>{
  const t=e.target;
  const toggle=t.closest('.js-toggle-script-edit');
  if(toggle){const{cid,tid}=toggle.dataset;const card=TODO.find(c=>c.id===cid);const take=card?.takes.find(t=>t.id===tid);if(take){take.editingScript=!take.editingScript;render();}return;}
  const cancel=t.closest('.js-cancel-script-edit');
  if(cancel){const take=TODO.find(c=>c.id===cancel.dataset.cid)?.takes.find(t=>t.id===cancel.dataset.tid);if(take){take.editingScript=false;render();}return;}
  const save=t.closest('.js-save-script-edit');
  if(save){const{cid,tid}=save.dataset;const take=TODO.find(c=>c.id===cid)?.takes.find(t=>t.id===tid);const ta=document.getElementById('sta-'+tid);if(take&&ta){take.script=ta.value.trim();take.editingScript=false;if(take.queueId)sessionStorage.setItem('ts-'+take.queueId,take.script);render();}return;}
  const copy=t.closest('.js-copy-take-script');
  if(copy){const take=TODO.find(c=>c.id===copy.dataset.cid)?.takes.find(t=>t.id===copy.dataset.tid);if(take?.script)navigator.clipboard.writeText(take.script).then(()=>showToast('Copied!'));return;}
});

// ─── PRODUCT PICKER ───────────────────────────────────────
function openPicker(){pickerSelected=new Set(TODO.map(c=>c.prodId).filter(Boolean));document.getElementById('pickerSearch').value='';filterPicker();document.getElementById('pickerModal').classList.add('open');setTimeout(()=>document.getElementById('pickerSearch').focus(),80);}
function closePicker(){document.getElementById('pickerModal').classList.remove('open');}
function filterPicker(){
  const q=document.getElementById('pickerSearch').value.toLowerCase();
  const list=ALL_PRODUCTS.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q));
  document.getElementById('pickerList').innerHTML=list.map(p=>`<div class="picker-item${pickerSelected.has(p.id)?' selected':''}" onclick="togglePick('${p.id}')"><div class="picker-check">${pickerSelected.has(p.id)?'✓':''}</div><div><div class="picker-name">${esc(p.name)}</div>${p.brand?`<div class="picker-meta">${esc(p.brand)}</div>`:''}</div></div>`).join('')||'<div style="text-align:center;padding:24px;color:var(--text-muted);font-style:italic;">No products found</div>';
}
function togglePick(id){if(pickerSelected.has(id))pickerSelected.delete(id);else pickerSelected.add(id);filterPicker();}
async function addSelectedProducts(){
  const existing=new Set(TODO.map(c=>c.prodId).filter(Boolean));
  const toAdd=[...pickerSelected].filter(id=>!existing.has(id));
  if(!toAdd.length){closePicker();return;}
  const btn=document.getElementById('pickerConfirmBtn');btn.disabled=true;btn.textContent='Adding...';
  for(const id of toAdd){
    const p=ALL_PRODUCTS.find(x=>x.id===id);if(!p)continue;
    const card={id:'c-'+uid(),prodId:p.id,name:p.name,brand:p.brand||'',script:'',takes:[]};
    const take={id:'t-'+uid(),queueId:null,hookText:'',script:'',inspirationLinks:[],done:false,sortOrder:0,editingScript:false};
    card.takes.push(take);TODO.push(card);await saveQueueRow(card,take);
  }
  closePicker();btn.disabled=false;btn.textContent='Add Selected';render();showToast(`Added ${toAdd.length} product${toAdd.length>1?'s':''}`);
}

// ─── HOOK PICKER ──────────────────────────────────────────
function openHookModal(cardId,takeId){
  hookTarget={cardId,takeId};const card=TODO.find(c=>c.id===cardId);
  document.getElementById('hookModalSub').textContent=card?'For: '+card.name:'';
  document.getElementById('customHookInput').value='';document.getElementById('hookSearch').value='';
  filterHooks();document.getElementById('hookModal').classList.add('open');
}
function closeHookModal(){document.getElementById('hookModal').classList.remove('open');}
function filterHooks(){
  const q=document.getElementById('hookSearch').value.toLowerCase();
  const filtered=ALL_HOOKS.filter(h=>!q||h.text.toLowerCase().includes(q)||(h.cat||'').toLowerCase().includes(q));
  const grouped={};filtered.forEach(h=>{const cat=h.cat||'Other';if(!grouped[cat])grouped[cat]=[];grouped[cat].push(h);});
  let html='';Object.entries(grouped).forEach(([cat,hooks])=>{html+=`<div class="hook-cat-label">${esc(cat)}</div>`;hooks.forEach(h=>{html+=`<div class="hook-item" onclick="selectHook('${h.id}')">${esc(h.text)}</div>`;});});
  document.getElementById('hookList').innerHTML=html||'<div style="text-align:center;padding:24px;color:var(--text-muted);font-style:italic;">No hooks yet — add some on the Hooks page!</div>';
}
async function selectHook(hookId){
  const hook=ALL_HOOKS.find(h=>h.id===hookId);if(!hook||!hookTarget)return;
  const take=TODO.find(c=>c.id===hookTarget.cardId)?.takes.find(t=>t.id===hookTarget.takeId);if(!take)return;
  take.hookText=hook.text;closeHookModal();render();
  if(take.queueId)await db.from('queue').update({notes:hook.text}).eq('id',take.queueId);
}
async function saveCustomHook(){
  const text=document.getElementById('customHookInput').value.trim();if(!text||!hookTarget)return;
  const take=TODO.find(c=>c.id===hookTarget.cardId)?.takes.find(t=>t.id===hookTarget.takeId);if(!take)return;
  take.hookText=text;closeHookModal();render();
  if(take.queueId)await db.from('queue').update({notes:text}).eq('id',take.queueId);
}

// ─── SCRIPT PICKER ────────────────────────────────────────
function openScriptModal(cardId,takeId){
  scriptTarget={cardId,takeId};const card=TODO.find(c=>c.id===cardId);
  document.getElementById('scriptModalSub').textContent=card?'For: '+card.name:'';
  document.getElementById('scriptSearch').value='';filterScripts();document.getElementById('scriptModal').classList.add('open');
}
function closeScriptModal(){document.getElementById('scriptModal').classList.remove('open');}
function filterScripts(){
  const q=document.getElementById('scriptSearch').value.toLowerCase();
  const card=TODO.find(c=>c.id===scriptTarget?.cardId);
  const sorted=[...ALL_SCRIPTS].sort((a,b)=>{const am=card&&(a.brand||'').toLowerCase()===(card.brand||'').toLowerCase();const bm=card&&(b.brand||'').toLowerCase()===(card.brand||'').toLowerCase();return bm-am;});
  const filtered=sorted.filter(s=>!q||s.title.toLowerCase().includes(q)||(s.brand||'').toLowerCase().includes(q)||s.script.toLowerCase().includes(q));
  document.getElementById('scriptList').innerHTML=filtered.map(s=>`<div class="script-pick-item" onclick="selectScript('${s.id}')">${s.brand?`<div class="script-pick-brand">${esc(s.brand)}</div>`:''}<div class="script-pick-title">${esc(s.title)}</div><div class="script-pick-preview">${esc(s.script)}</div></div>`).join('')||'<div style="text-align:center;padding:24px;color:var(--text-muted);font-style:italic;">No scripts yet — add some on the Scripts page!</div>';
}
function selectScript(scriptId){
  const script=ALL_SCRIPTS.find(s=>s.id===scriptId);if(!script||!scriptTarget)return;
  const take=TODO.find(c=>c.id===scriptTarget.cardId)?.takes.find(t=>t.id===scriptTarget.takeId);if(!take)return;
  take.script=script.script;if(take.queueId)sessionStorage.setItem('ts-'+take.queueId,take.script);
  closeScriptModal();render();
}

['pickerModal','hookModal','scriptModal'].forEach(id=>{document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});});

// ─── INIT ─────────────────────────────────────────────────
async function init(){
  _user=await requireAuth();if(!_user)return;
  const prefs=await loadUserPrefs(_user.id);
  await initDisplayName(_user,prefs);
  await initCore5(_user.id,prefs);
  await initTheme(_user.id,prefs);
  initProfilePopover(_user.id);
  updateDateDisplay();
  await Promise.all([loadProducts(),loadHooks(),loadScripts(),loadQueue()]);
  render();
}
init();
