<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C2130">
<title>Daily To Do — Creator Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200;300;400;500;600;700&family=Stack+Sans+Text:wght@200..700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
<script src="theme-init.js?v=141"></script>
<link rel="stylesheet" href="layout.css?v=141">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=141"></script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creator Hub">
<link rel="apple-touch-icon" sizes="180x180" href="icons/pwa/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/pwa/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Serif',serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}


.page{max-width:1180px;margin:0 auto;padding:0 40px 100px;}
.page-header{padding:34px 0 28px;border-bottom:1px solid var(--border-mid);margin-bottom:36px;}
.page-title{font-family:'IBM Plex Serif',serif;font-size:clamp(60px,8vw,104px);font-weight:700;line-height:0.82;letter-spacing:-0.02em;color:var(--ink);}
.page-title em{font-style:italic;color:var(--sage);}
.todo-toolbar{display:grid;grid-template-columns:auto minmax(260px,1fr) auto auto;gap:18px;align-items:center;margin-top:24px;}
.toolbar-date{display:flex;align-items:center;gap:18px;min-width:0;}
.header-actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-family:'Stack Sans Notch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border:none;transition:all 0.15s;}
.btn-primary{background:var(--rust);color:#fff;}
.btn-primary:hover{opacity:0.88;}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border-mid);}
.btn-ghost:hover{background:var(--surface);color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-xs{padding:4px 9px;font-size:10px;}

.date-arrow{width:44px;height:44px;background:color-mix(in srgb,var(--surface) 68%,var(--bg) 32%);border:1px solid var(--border-mid);border-radius:12px;font-family:'Stack Sans Notch',sans-serif;font-size:22px;font-weight:700;cursor:pointer;color:var(--text-mid);transition:all 0.12s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.date-arrow:hover{border-color:var(--rust);color:var(--rust);background:color-mix(in srgb,var(--surface) 76%,var(--rust) 12%);}
.date-label{font-family:'Stack Sans Text',sans-serif;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.date-badge{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--rust);background:color-mix(in srgb,var(--rust) 12%,transparent);padding:3px 10px;border-radius:100px;}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:34px;}
.week-day{min-width:0;min-height:88px;border:1px solid var(--border-mid);border-radius:16px;background:color-mix(in srgb,var(--surface) 68%,var(--bg) 32%);color:var(--text-mid);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:background 0.15s,border-color 0.15s,color 0.15s,transform 0.15s;}
.week-day:hover{border-color:var(--rust);color:var(--ink);background:color-mix(in srgb,var(--surface) 72%,var(--rust) 10%);}
.week-day.active{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:var(--shadow-sm);}
.week-day-dow{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:currentColor;opacity:0.68;}
.week-day-num{font-family:'Noto Sans Mono',sans-serif;font-size:28px;font-weight:900;line-height:1;color:currentColor;}
.week-day-dot{width:7px;height:7px;border-radius:50%;background:var(--rust);opacity:0;}
.week-day.has-items .week-day-dot{opacity:1;}
.week-day.active .week-day-dot{background:var(--bg);opacity:0.72;}

.progress-summary{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.progress-text{font-family:'Stack Sans Notch',sans-serif;font-size:13px;font-weight:700;color:var(--ink);}
.progress-text span{color:var(--rust);}
.progress-pills{display:flex;gap:8px;}
.progress-pill{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 14px;border-radius:100px;border:1px solid var(--border-mid);}
.pill-filmed{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--sage);border-color:color-mix(in srgb,var(--sage) 28%,transparent);}
.pill-remaining{background:color-mix(in srgb,var(--rust) 14%,transparent);color:var(--rust);border-color:color-mix(in srgb,var(--rust) 24%,transparent);}
.progress-bar-wrap{width:100%;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex-basis:100%;}
.progress-bar-fill{height:100%;background:var(--rust);border-radius:2px;transition:width 0.4s ease;}

.brand-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.brand-pill{font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;border-radius:100px;border:1px solid var(--border-mid);background:var(--surface);color:var(--text-mid);cursor:pointer;transition:all 0.12s;}
.brand-pill:hover{border-color:var(--rust);color:var(--rust);}
.brand-pill.active{background:var(--rust);color:#fff;border-color:var(--rust);}
.brand-pill.toggle-active{background:var(--sage);color:var(--bg);border-color:var(--sage);}

.empty-state{text-align:center;padding:64px 24px;}
.empty-title{font-family:'IBM Plex Serif',serif;font-size:28px;font-weight:700;color:var(--text-mid);margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6;}

.cards-list{display:flex;flex-direction:column;gap:14px;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.product-list-card{width:100%;text-align:left;cursor:pointer;transition:border-color 0.14s,background 0.14s,transform 0.14s;}
.product-list-card:hover{border-color:var(--rust);background:color-mix(in srgb,var(--surface) 90%,var(--rust) 10%);transform:translateY(-1px);}
.product-card-row{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;}
.product-card-main{min-width:0;}
.product-card-name{font-family:'IBM Plex Serif',serif;font-size:24px;font-weight:800;line-height:1.1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.product-card-brand{font-size:12px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.08em;text-transform:uppercase;margin-top:5px;}
.product-progress-count{font-family:'Noto Sans Mono',monospace;font-size:14px;font-weight:900;color:var(--ink);background:color-mix(in srgb,var(--bg) 58%,var(--surface) 42%);border:1px solid var(--border-mid);border-radius:999px;padding:6px 12px;white-space:nowrap;}
.takes-view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.takes-back{background:transparent;border:1px solid var(--border-mid);border-radius:8px;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:7px 12px;cursor:pointer;}
.takes-back:hover{border-color:var(--rust);color:var(--rust);}
.takes-title{font-family:'IBM Plex Serif',serif;font-size:30px;font-weight:800;line-height:1.05;color:var(--ink);}
.takes-sub{font-size:12px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;}
	.pcard-header{background:color-mix(in srgb,var(--surface) 55%,var(--bg) 45%);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);}
	.pcard-name{font-family:'Stack Sans Notch',sans-serif;font-size:15px;font-weight:800;color:var(--ink);}
	.pcard-name a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.12s,color 0.12s;}
	.pcard-name a:hover{color:var(--rust);border-bottom-color:var(--rust);}
	.pcard-brand{font-size:11px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.07em;text-transform:uppercase;margin-top:2px;}
.pcard-btns{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.hbtn{background:color-mix(in srgb,var(--surface) 68%,var(--bg) 32%);border:1px solid var(--border-mid);border-radius:6px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.12s;}
.hbtn:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
.hbtn.danger:hover{background:rgba(180,50,40,0.15);color:#c83c32;border-color:rgba(180,50,40,0.3);}

.takes-wrap{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.take-card{background:color-mix(in srgb,var(--bg) 55%,var(--surface) 45%);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:opacity 0.15s;}
.take-card.done{opacity:0.5;}
.take-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;}
.take-row-hook{font-size:14px;color:var(--ink);font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.take-row-meta{font-size:11px;color:var(--text-muted);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.06em;text-transform:uppercase;margin-top:3px;}
.take-card.expanded{opacity:1;}
.take-expanded{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.take-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.take-num{color:var(--rust);}

.hook-display{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:10px 14px;font-size:13px;font-style:italic;color:var(--text-mid);line-height:1.5;margin-bottom:10px;border-left:3px solid var(--rust);cursor:pointer;transition:border-color 0.12s;}
.hook-display:hover{border-color:color-mix(in srgb,var(--rust) 70%,transparent);}
.hook-actions{margin-bottom:10px;}

.script-display{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.75;color:var(--text);border-left:3px solid var(--sage);margin-bottom:8px;}
.script-textarea{width:100%;padding:10px 12px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.75;font-family:'IBM Plex Serif',serif;outline:none;resize:vertical;min-height:100px;transition:border-color 0.15s;}
.script-textarea:focus{border-color:var(--rust);}
.script-actions{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.take-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0;}
.take-field{min-width:0;}
.take-field label{display:block;font-family:'Stack Sans Notch',sans-serif;font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;}
.take-field textarea,.take-field input{width:100%;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);font-family:'IBM Plex Serif',serif;font-size:12px;line-height:1.45;padding:8px 10px;outline:none;resize:vertical;min-height:42px;}
.take-field textarea:focus,.take-field input:focus{border-color:var(--rust);}
.take-field.full{grid-column:1/-1;}
.location-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 10px;}
.location-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);}
.location-pill{border:1px solid var(--border-mid);border-radius:999px;background:var(--surface);font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:900;letter-spacing:0.05em;text-transform:uppercase;padding:6px 10px;color:var(--text-mid);outline:none;cursor:pointer;}
.location-pill:focus{border-color:var(--rust);}
.location-pill.bedroom{background:color-mix(in srgb,var(--sage) 22%,transparent);border-color:color-mix(in srgb,var(--sage) 34%,transparent);color:var(--sage);}
.location-pill.outside{background:color-mix(in srgb,#5B8CCC 20%,transparent);border-color:color-mix(in srgb,#5B8CCC 34%,transparent);color:#89B4F5;}
.location-pill.kitchen{background:color-mix(in srgb,var(--rose) 24%,transparent);border-color:color-mix(in srgb,var(--rose) 38%,transparent);color:var(--rose);}
.location-pill.living-room{background:color-mix(in srgb,#9B7BC8 22%,transparent);border-color:color-mix(in srgb,#9B7BC8 36%,transparent);color:#C4A0F0;}
.location-pill.car{background:color-mix(in srgb,var(--tan) 22%,transparent);border-color:color-mix(in srgb,var(--tan) 36%,transparent);color:var(--tan);}
.location-pill.other{background:color-mix(in srgb,#E0C45C 24%,transparent);border-color:color-mix(in srgb,#E0C45C 38%,transparent);color:#E0C45C;}
.location-pill.type-product-demo{background:color-mix(in srgb,var(--rust) 18%,transparent);border-color:color-mix(in srgb,var(--rust) 30%,transparent);color:var(--rust);}
.location-pill.type-talking-head{background:color-mix(in srgb,var(--sage) 20%,transparent);border-color:color-mix(in srgb,var(--sage) 32%,transparent);color:var(--sage);}
.location-pill.type-voiceover{background:color-mix(in srgb,#5B8CCC 20%,transparent);border-color:color-mix(in srgb,#5B8CCC 34%,transparent);color:#89B4F5;}
.location-pill.type-faceless-b-roll{background:color-mix(in srgb,var(--tan) 22%,transparent);border-color:color-mix(in srgb,var(--tan) 36%,transparent);color:var(--tan);}
.location-pill.type-asmr-unboxing{background:color-mix(in srgb,#9B7BC8 22%,transparent);border-color:color-mix(in srgb,#9B7BC8 36%,transparent);color:#C4A0F0;}
.location-pill.type-before-after{background:color-mix(in srgb,var(--rose) 22%,transparent);border-color:color-mix(in srgb,var(--rose) 36%,transparent);color:var(--rose);}
.location-pill.type-skit{background:color-mix(in srgb,#E0C45C 22%,transparent);border-color:color-mix(in srgb,#E0C45C 36%,transparent);color:#E0C45C;}
.location-other{min-width:160px;max-width:260px;flex:1;border:1px solid var(--border-mid);border-radius:999px;background:var(--bg);color:var(--text);font-family:'IBM Plex Serif',serif;font-size:12px;padding:7px 11px;outline:none;}
.location-other:focus{border-color:#E0C45C;}

.insp-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.insp-label{font-family:'Stack Sans Notch',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.insp-links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.insp-link{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border-mid);border-radius:100px;color:var(--rust);font-size:11px;font-weight:600;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;max-width:200px;transition:border-color 0.12s;}
.insp-link:hover{border-color:var(--rust);}
.insp-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.insp-remove{background:none;border:none;color:var(--text-muted);font-size:14px;line-height:1;cursor:pointer;padding:0;transition:color 0.12s;}
.insp-remove:hover{color:#c83c32;}
.insp-add{display:flex;gap:6px;}
.insp-input{flex:1;min-width:0;padding:7px 11px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;font-family:'IBM Plex Serif',serif;outline:none;transition:border-color 0.15s;}
.insp-input::placeholder{color:var(--text-muted);}
.insp-input:focus{border-color:var(--rust);}
.insp-add-btn{background:var(--surface);border:1px solid var(--border-mid);border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;color:var(--text-mid);cursor:pointer;font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;transition:all 0.12s;}
.insp-add-btn:hover{background:var(--rust);border-color:var(--rust);color:#fff;}

.take-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.take-status{font-family:'Stack Sans Notch',sans-serif;font-size:11px;color:var(--text-muted);}
.take-status.filmed{color:var(--sage);}
.take-footer-btns{display:flex;gap:6px;}
.tbtn{background:none;border:1px solid var(--border-mid);border-radius:6px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.12s;white-space:nowrap;}
.tbtn:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
.tbtn.done-active{background:color-mix(in srgb,var(--sage) 18%,transparent);color:var(--sage);border-color:color-mix(in srgb,var(--sage) 28%,transparent);}
.tbtn.del:hover{background:rgba(180,50,40,0.12);color:#c83c32;border-color:rgba(180,50,40,0.25);}
.add-take-btn{width:100%;background:none;border:1px dashed var(--border-mid);border-radius:10px;padding:9px;font-size:11px;color:var(--text-muted);cursor:pointer;font-family:'Stack Sans Notch',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.12s;}
.add-take-btn:hover{border-color:var(--rust);color:var(--rust);}
/* undo toast */
.undo-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:14px;font-family:'Stack Sans Notch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.05em;box-shadow:0 6px 28px rgba(0,0,0,0.38);z-index:9999;opacity:0;transition:opacity 0.2s,transform 0.2s;white-space:nowrap;pointer-events:none;}
.undo-toast.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.undo-toast-btn{background:var(--rust);color:#fff;border:none;border-radius:7px;padding:5px 13px;font-family:'Stack Sans Notch',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.06em;cursor:pointer;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:400;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--border-mid);padding:24px;width:100%;max-width:560px;max-height:88vh;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.3);display:flex;flex-direction:column;}
.modal-title{font-family:'IBM Plex Serif',serif;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;}
.modal-search{width:100%;padding:10px 14px;border:1px solid var(--border-mid);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:'IBM Plex Serif',serif;outline:none;margin-bottom:12px;}
.modal-search:focus{border-color:var(--rust);}
.modal-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:0;}
.modal-footer{display:flex;gap:8px;margin-top:16px;flex-shrink:0;}
.modal-cancel{flex:1;background:var(--bg);border:1px solid var(--border-mid);border-radius:10px;padding:12px;font-size:12px;cursor:pointer;color:var(--text-mid);font-family:'Stack Sans Notch',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.modal-confirm{flex:2;background:var(--rust);border:none;border-radius:10px;padding:12px;font-size:12px;cursor:pointer;color:#fff;font-family:'Stack Sans Notch',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.modal-confirm:hover{opacity:0.88;}
.modal-confirm:disabled{opacity:0.5;cursor:not-allowed;}

<script src="layout.js?v=141"></script>
<script>
let _user = null;
let ALL_PRODUCTS = [], ALL_HOOKS = [], ALL_SCRIPTS = [];
let TODO = [];
let activeBrandFilter = 'All';
let hideFilmed = localStorage.getItem('take24:hideFilmed') === '1';
let selectedProductId = null;
let expandedTakeId = null;
// Pre-filter by brand if coming from lineup strip
const _urlBrand = new URLSearchParams(window.location.search).get('brand');
if (_urlBrand) activeBrandFilter = _urlBrand;
let pickerSelected = new Set();
let hookTarget = null;
let scriptTarget = null;

const today = new Date();
let currentDate = new Date(today);

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayKey = dateKey(today);
function currentKey(){return dateKey(currentDate);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function addDays(date, amount){const d=new Date(date);d.setDate(d.getDate()+amount);return d;}

function getLinkLabel(url){try{const u=new URL(url);return u.hostname.replace(/^www\./,'')+(u.pathname.length>1?u.pathname.slice(0,18):'');}catch(e){return url.replace(/^https?:\/\//,'').slice(0,28);}}
function normalizeUrl(url){const t=(url||'').trim();if(!t)return '';return /^https?:\/\//i.test(t)?t:'https://'+t;}
const LOCATION_OPTIONS=[
  {value:'',label:'Set location',cls:''},
  {value:'bedroom',label:'Bedroom',cls:'bedroom'},
  {value:'outside',label:'Outside',cls:'outside'},
  {value:'car',label:'Car',cls:'car'},
  {value:'kitchen',label:'Kitchen',cls:'kitchen'},
  {value:'living-room',label:'Living Room',cls:'living-room'},
  {value:'other',label:'Other',cls:'other'}
];
const TYPE_OPTIONS=[
  {value:'',label:'Set type',cls:''},
  {value:'product-demo',label:'🎬 Product Demo',cls:'type-product-demo'},
  {value:'talking-head',label:'🗣️ Talking Head',cls:'type-talking-head'},
  {value:'voiceover',label:'🎙️ Voiceover',cls:'type-voiceover'},
  {value:'faceless-b-roll',label:'📦 Faceless B-Roll',cls:'type-faceless-b-roll'},
  {value:'asmr-unboxing',label:'🤫 ASMR / Unboxing',cls:'type-asmr-unboxing'},
  {value:'before-after',label:'🔄 Before & After',cls:'type-before-after'},
  {value:'skit',label:'💬 Skit',cls:'type-skit'}
];
function displayHookText(text){
  return String(text||'')
    .replace(/\bSCHED_TIME\s*:\s*\d{1,2}:?\d{0,2}\b/gi,'')
    .replace(/\bSTATUS\s*:\s*[\w-]+\b/gi,'')
    .replace(/^LOCATION\s*:[^\n]*\n?/gim,'')
    .replace(/^TYPE\s*:[^\n]*\n?/gim,'')
    .replace(/^ON_SCREEN_TEXT\s*:[^\n]*\n?/gim,'')
    .replace(/^SEO_STRATEGY\s*:[^\n]*\n?/gim,'')
    .replace(/^CAPTION\s*:[^\n]*\n?/gim,'')
    .replace(/^HASHTAGS\s*:[^\n]*\n?/gim,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function getFilmingLocation(notes){
  const match=String(notes||'').match(/^LOCATION\s*:\s*([^\n]*)/im);
  const raw=(match?.[1]||'').trim();
  if(!raw)return {type:'',label:''};
  const other=raw.match(/^other\s*:\s*(.*)$/i);
  if(other)return {type:'other',label:other[1].trim()};
  const type=raw.toLowerCase().replace(/\s+/g,'-');
  const option=LOCATION_OPTIONS.find(item=>item.value===type);
  return {type:option?type:'other',label:option?option.label:raw};
}
function withoutMetaLine(notes,key){
  const pattern=new RegExp(`^${key}\\s*:[^\\n]*\\n?`,'gim');
  return String(notes||'').replace(pattern,'').trim();
}
function setFilmingLocationLine(notes,type,label=''){
  const body=withoutMetaLine(notes,'LOCATION');
  const cleanType=String(type||'').trim();
  if(!cleanType)return body;
  const value=cleanType==='other'
    ? `other:${String(label||'').trim()}`
    : cleanType;
  return [body,`LOCATION:${value}`].filter(Boolean).join('\n');
}
function getFilmingType(notes){
  const raw=(String(notes||'').match(/^TYPE\s*:\s*([^\n]*)/im)?.[1]||'').trim().toLowerCase();
  if(!raw)return {type:'',label:''};
  const type=raw.replace(/\s+/g,'-');
  const option=TYPE_OPTIONS.find(item=>item.value===type);
  return {type:option?type:'talking-head',label:option?option.label:'🗣️ Talking Head'};
}
function setFilmingTypeLine(notes,type){
  const body=withoutMetaLine(notes,'TYPE');
  const cleanType=String(type||'').trim();
  if(!cleanType)return body;
  return [body,`TYPE:${cleanType}`].filter(Boolean).join('\n');
}
const TAKE_FIELD_META={
  onscreen:{key:'ON_SCREEN_TEXT',label:'On-screen text',placeholder:'Text viewers should see on screen...'},
  seo:{key:'SEO_STRATEGY',label:'SEO strategy',placeholder:'Keywords, search phrases, product terms...'},
  caption:{key:'CAPTION',label:'Caption',placeholder:'Write the caption for this video...'},
  hashtags:{key:'HASHTAGS',label:'Hashtags',placeholder:'#tiktokshop #productfinds'}
};
function encodeTakeField(value){
  return encodeURIComponent(String(value||'').trim());
}
function encodeTakeSnapshot(value){
  return encodeURIComponent(JSON.stringify(value||{}));
}
function decodeTakeField(value){
  try{return decodeURIComponent(String(value||''));}catch(e){return String(value||'');}
}
function getTakeField(notes,field){
  const meta=TAKE_FIELD_META[field];
  if(!meta)return '';
  const match=String(notes||'').match(new RegExp(`^${meta.key}\\s*:\\s*([^\\n]*)`,'im'));
  return match?decodeTakeField(match[1].trim()):'';
}
function setTakeFieldLine(notes,field,value){
  const meta=TAKE_FIELD_META[field];
  if(!meta)return notes||'';
  const body=withoutMetaLine(notes,meta.key);
  const clean=String(value||'').trim();
  if(!clean)return body;
  return [body,`${meta.key}:${encodeTakeField(clean)}`].filter(Boolean).join('\n');
}
function replaceVisibleHook(notes,nextHook){
  const hidden=String(notes||'')
    .split('\n')
    .map(line=>line.trim())
    .filter(line=>/^(LOCATION|TYPE|SCHED_TIME|STATUS|ON_SCREEN_TEXT|SEO_STRATEGY|CAPTION|HASHTAGS)\s*:/i.test(line));
  return [String(nextHook||'').trim(),...hidden].filter(Boolean).join('\n');
}
function locationClass(type){
  return LOCATION_OPTIONS.find(item=>item.value===type)?.cls||'';
}
function locationSelectHtml(cardId,take){
  const loc=getFilmingLocation(take.hookText);
  const selectClass=['location-pill',locationClass(loc.type)].filter(Boolean).join(' ');
  return `<div class="location-row">
    <span class="location-label">Filming Location</span>
    <select class="${selectClass}" onchange="setFilmingLocation('${esc(cardId)}','${esc(take.id)}',this.value)">
      ${LOCATION_OPTIONS.map(option=>`<option value="${esc(option.value)}"${loc.type===option.value?' selected':''}>${esc(option.label)}</option>`).join('')}
    </select>
    ${loc.type==='other'?`<input class="location-other" id="loc-${esc(take.id)}" value="${esc(loc.label)}" placeholder="Type location..." onblur="saveOtherLocation('${esc(cardId)}','${esc(take.id)}')" onkeydown="if(event.key==='Enter'){event.preventDefault();saveOtherLocation('${esc(cardId)}','${esc(take.id)}');this.blur();}">`:''}
  </div>`;
}
function typeClass(type){
  return TYPE_OPTIONS.find(item=>item.value===type)?.cls||'';
}
function typeSelectHtml(cardId,take){
  const type=getFilmingType(take.hookText);
  const selectClass=['location-pill',typeClass(type.type)].filter(Boolean).join(' ');
  return `<div class="location-row">
    <span class="location-label">Type</span>
    <select class="${selectClass}" onchange="setFilmingType('${esc(cardId)}','${esc(take.id)}',this.value)">
      ${TYPE_OPTIONS.map(option=>`<option value="${esc(option.value)}"${type.type===option.value?' selected':''}>${esc(option.label)}</option>`).join('')}
    </select>
  </div>`;
}
function takeFieldsHtml(cardId,take){
  const fieldHtml=(field,extraClass='')=>{
    const meta=TAKE_FIELD_META[field];
    const value=getTakeField(take.hookText,field);
    const inputId=`take-${field}-${take.id}`;
    const common=`id="${esc(inputId)}" placeholder="${esc(meta.placeholder)}" onblur="saveTakeField('${esc(cardId)}','${esc(take.id)}','${esc(field)}')"`;
    const control=field==='hashtags'
      ? `<input type="text" ${common} value="${esc(value)}">`
      : `<textarea ${common}>${esc(value)}</textarea>`;
    return `<div class="take-field ${extraClass}"><label for="${esc(inputId)}">${esc(meta.label)}</label>${control}</div>`;
  };
  return `<div class="take-fields">
    ${fieldHtml('onscreen')}
    ${fieldHtml('seo')}
    ${fieldHtml('caption','full')}
    ${fieldHtml('hashtags','full')}
  </div>`;
}

// ─── DATE NAV ─────────────────────────────────────────────
function updateDateDisplay(){
  const key=currentKey(),isToday=key===todayKey;
  const formatted=currentDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('dateLabel').textContent=isToday?`Today — ${formatted}`:formatted;
  const badge=document.getElementById('dateBadge');
  if(isToday){badge.style.display='none';}
  else{badge.style.display='inline-block';badge.textContent=key>todayKey?'Future':'Past';}
  renderWeekStrip();
}
function changeDay(dir){currentDate=new Date(currentDate);currentDate.setDate(currentDate.getDate()+dir);updateDateDisplay();loadQueue().then(render);}
function goToToday(){if(currentKey()===todayKey)return;currentDate=new Date(today);updateDateDisplay();loadQueue().then(render);}
function pickWeekDate(offset){currentDate=addDays(currentDate,offset);updateDateDisplay();loadQueue().then(render);}
function centerActiveWeekDay(){
  const strip=document.getElementById('weekStrip');
  const active=strip?.querySelector('.week-day.active');
  if(!strip||!active||strip.scrollWidth<=strip.clientWidth)return;
  const left=active.offsetLeft-(strip.clientWidth-active.offsetWidth)/2;
  strip.scrollTo({left:Math.max(0,left),behavior:'smooth'});
}
function renderWeekStrip(){
  const strip=document.getElementById('weekStrip');
  if(!strip)return;
  const offsets=[-3,-2,-1,0,1,2,3];
  const active=currentKey();
  strip.innerHTML=offsets.map(offset=>{
    const d=addDays(currentDate,offset);
    const key=dateKey(d);
    const hasItems=key===active&&TODO.length>0;
    return `<button class="week-day${key===active?' active':''}${hasItems?' has-items':''}" type="button" onclick="pickWeekDate(${offset})">
      <span class="week-day-dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</span>
      <span class="week-day-num">${d.getDate()}</span>
      <span class="week-day-dot"></span>
    </button>`;
  }).join('');
  requestAnimationFrame(centerActiveWeekDay);
}
function restartDay(){goToToday();}
async function refreshDay(btn){
  const original=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='Refreshing';}
  await loadQueue();
  render();
  if(btn){btn.disabled=false;btn.textContent=original || 'Refresh';}
}

// ─── DATA ─────────────────────────────────────────────────
async function loadProducts(){const{data}=await db.from('products').select('id,name,brand,link,notes').eq('user_id',_user.id).order('name');ALL_PRODUCTS=data||[];}
async function loadHooks(){const{data}=await db.from('hooks').select('id,text,cat').eq('user_id',_user.id).order('cat');ALL_HOOKS=data||[];}
async function loadScripts(){const{data}=await db.from('scripts').select('id,title,brand,script').eq('user_id',_user.id).order('title');ALL_SCRIPTS=data||[];}

async function loadQueue(){
  if(currentKey()===todayKey) await carryForwardUnfinishedQueue(_user.id, todayKey);
  const{data}=await db.from('queue').select('*').eq('user_id',_user.id).eq('date',currentKey()).order('sort_order');
  const cardMap={};
  (data||[]).forEach(row=>{
    const key=row.prod_id||('_n_'+row.name);
    if(!cardMap[key])cardMap[key]={id:'c-'+key,prodId:row.prod_id,name:row.name,brand:row.brand||'',script:'',takes:[]};
    cardMap[key].takes.push({id:'t-'+row.id,queueId:row.id,hookText:row.notes||'',script:row.script||'',inspirationLinks:normalizeInspirationLinks(row.inspiration_links),done:row.done,sortOrder:row.sort_order,editingScript:false});
  });
  TODO=Object.values(cardMap);
}

async function saveQueueRow(card,take){
  const payload={user_id:_user.id,date:currentKey(),prod_id:card.prodId||null,name:card.name,brand:card.brand||'',notes:take.hookText||'',script:take.script||'',inspiration_links:normalizeInspirationLinks(take.inspirationLinks),done:take.done||false,sort_order:take.sortOrder||0};
  const save = take.queueId
    ? () => db.from('queue').update(payload).eq('id',take.queueId)
    : () => db.from('queue').insert(payload).select('id').single();
  let { data, error } = await save();
  if(error && /inspiration_links/i.test(error.message || '')){
    const { inspiration_links, ...fallbackPayload } = payload;
    const fallback = take.queueId
      ? await db.from('queue').update(fallbackPayload).eq('id',take.queueId)
      : await db.from('queue').insert(fallbackPayload).select('id').single();
    data = fallback.data;
    error = fallback.error;
  }
  if(!take.queueId && data) take.queueId=data.id;
  if(error) { console.error('Queue save failed', error); throw new Error(error.message || 'Supabase save error'); }
}
async function deleteQueueRow(take){if(take.queueId){await db.from('queue').delete().eq('id',take.queueId);sessionStorage.removeItem('ts-'+take.queueId);}}

// ─── RENDER ───────────────────────────────────────────────
function getFilteredCards(){
  const brandFiltered=activeBrandFilter==='All'?TODO:TODO.filter(c=>(c.brand||'')=== activeBrandFilter);
  if(!hideFilmed)return brandFiltered;
  return brandFiltered
    .map(card=>({...card,_allTakes:card.takes||[],takes:(card.takes||[]).filter(take=>!take.done)}))
    .filter(card=>(card.takes||[]).length>0);
}
function productBankUrl(card){
  const brand=String(card?.brand||'').trim();
  if(brand)return 'products.html?brand='+encodeURIComponent(brand);
  return 'products.html?search='+encodeURIComponent(String(card?.name||'').trim());
}
function scriptWorkshopUrl(card){
  const params=new URLSearchParams();
  if(card?.prodId)params.set('productId',card.prodId);
  if(card?.name)params.set('productName',card.name);
  if(card?.brand)params.set('brand',card.brand);
  return 'script-workshop.html'+(params.toString()?'?'+params.toString():'');
}
function normalizeInspirationLinks(value){
  if(Array.isArray(value)) return value.map(normalizeUrl).filter(Boolean);
  if(typeof value==='string'){
    try { return normalizeInspirationLinks(JSON.parse(value)); } catch(e) {}
    return value.split(',').map(normalizeUrl).filter(Boolean);
  }
  return [];
}

function selectedProductFromUrl(){
  return new URLSearchParams(window.location.search).get('product') || null;
}
function jsArg(value){
  return esc(JSON.stringify(String(value ?? '')));
}
function replaceProductUrl(cardId){
  const params=new URLSearchParams(window.location.search);
  if(cardId)params.set('product',cardId);
  else params.delete('product');
  const next=window.location.pathname+(params.toString()?'?'+params.toString():'');
  history.replaceState({},'',next);
}
function pushProductUrl(cardId){
  const params=new URLSearchParams(window.location.search);
  if(cardId)params.set('product',cardId);
  else params.delete('product');
  const next=window.location.pathname+(params.toString()?'?'+params.toString():'');
  history.pushState({},'',next);
}
function openProductTakes(cardId){
  selectedProductId=cardId;
  expandedTakeId=null;
  pushProductUrl(cardId);
  renderCards();
}
function showProductList(push=false){
  selectedProductId=null;
  expandedTakeId=null;
  if(push)pushProductUrl(null);
  else replaceProductUrl(null);
  renderCards();
}
function toggleTakeExpanded(takeId){
  expandedTakeId=expandedTakeId===takeId?null:takeId;
  renderCards();
}
window.addEventListener('popstate',()=>{
  selectedProductId=selectedProductFromUrl();
  expandedTakeId=null;
  renderCards();
});

function render(){
  renderWeekStrip();
  renderProgress();
  renderFilterPills();
  renderCards();
}

function renderProgress(){
  const allTakes=TODO.flatMap(c=>c.takes),done=allTakes.filter(t=>t.done).length,total=allTakes.length;
  const clearBtn=document.getElementById('clearDoneBtn');
  if(clearBtn) clearBtn.disabled=done===0;
  const pArea=document.getElementById('progressArea');
  if(total>0){
    pArea.innerHTML=`<div class="progress-summary">
      <div class="progress-text"><span>${done}/${total}</span> takes done today</div>
      <div class="progress-pills"><span class="progress-pill pill-filmed">${done} Filmed</span><span class="progress-pill pill-remaining">${total-done} Remaining</span></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${total?(done/total*100):0}%"></div></div>
    </div>`;
  } else pArea.innerHTML='';
}

function renderFilterPills(){
  const done=TODO.flatMap(c=>c.takes).filter(t=>t.done).length;
  const brands=[...new Set(TODO.map(c=>c.brand).filter(Boolean))].sort();
  const fArea=document.getElementById('brandFilterArea');
  if(brands.length>1||done>0){
    const brandButtons=brands.length>1
      ? `<button class="brand-pill${activeBrandFilter==='All'?' active':''}" onclick="setBrandFilter(${jsArg('All')})">All</button>${brands.map(b=>`<button class="brand-pill${activeBrandFilter===b?' active':''}" onclick="setBrandFilter(${jsArg(b)})">${esc(b)}</button>`).join('')}`
      : '';
    fArea.innerHTML=`<div class="brand-filter">${brandButtons}<button class="brand-pill${hideFilmed?' toggle-active':''}" onclick="toggleHideFilmed()">${hideFilmed?'Show Filmed':'Hide Filmed'}</button></div>`;
  } else fArea.innerHTML='';
}

function renderCards(){
  const main=document.getElementById('mainContent');
  const filtered=getFilteredCards();
  if(selectedProductId){
    const card=TODO.find(item=>item.id===selectedProductId);
    if(card){
      main.innerHTML=renderTakesView(card);
      return;
    }
    selectedProductId=null;
    expandedTakeId=null;
    replaceProductUrl(null);
  }
  if(!TODO.length){
    main.innerHTML=`<div class="empty-state"><div class="empty-title">Nothing planned yet</div><div class="empty-sub">Tap "+ Product" to pick products you're filming today.</div><button class="btn btn-primary" onclick="openPicker()">+ Product</button></div>`;
    return;
  }
  if(!filtered.length){
    const title=hideFilmed?'No unfilmed takes here':`No ${esc(activeBrandFilter)} products today`;
    const action=hideFilmed
      ? '<button class="btn btn-ghost" onclick="toggleHideFilmed()" style="margin-top:12px;">Show Filmed</button>'
      : '<button class="btn btn-ghost" onclick="setBrandFilter(\'All\')" style="margin-top:12px;">Show All</button>';
    main.innerHTML=`<div class="empty-state" style="padding:40px 24px;"><div class="empty-title">${title}</div>${action}</div>`;
    return;
  }

  let html='<div class="cards-list">';
	  filtered.forEach(card=>{
	    const takes=card.takes||[],allTakes=card._allTakes||takes,doneTakes=allTakes.filter(t=>t.done).length;
	    html+=`<div class="pcard product-list-card" id="${esc(card.id)}" onclick="openProductTakes(${jsArg(card.id)})">
        <div class="product-card-row">
          <div class="product-card-main">
            <div class="product-card-name">${esc(card.name)}</div>
            ${card.brand?`<div class="product-card-brand">${esc(card.brand)}</div>`:''}
          </div>
          <span class="product-progress-count pcard-count">${doneTakes}/${allTakes.length} done</span>
          <div class="pcard-btns" onclick="event.stopPropagation();">
            <a class="hbtn" href="${esc(scriptWorkshopUrl(card))}">Workshop</a>
            <button class="hbtn danger" onclick="removeCard(${jsArg(card.id)})">Remove</button>
          </div>
        </div>
      </div>`;
  });

  html+='</div>';
  main.innerHTML=html;
}

function firstScriptSentence(script){
  const text=String(script||'')
    .replace(/\*\*/g,'')
    .replace(/\[[^\]]+\]/g,'')
    .replace(/\s+/g,' ')
    .trim();
  if(!text)return '';
  const match=text.match(/^(.+?[.!?])(?:\s|$)/);
  return (match?match[1]:text).trim();
}

function renderTakeRow(card,take,index,totalTakes){
  const expanded=expandedTakeId===take.id;
  const hook=displayHookText(take.hookText) || firstScriptSentence(take.script) || 'Choose hook';
  return `<div class="take-card${take.done?' done':''}${expanded?' expanded':''}" id="${esc(take.id)}" onclick="toggleTakeExpanded(${jsArg(take.id)})">
    <div class="take-row">
      <div>
        <div class="take-label" style="margin-bottom:6px;"><span class="take-num">Take${totalTakes>1?' '+(index+1):''}</span><span class="take-filmed-marker" style="color:var(--sage);font-size:10px;${take.done?'':'display:none;'}">✓ Filmed</span></div>
        <div class="take-row-hook">${esc(hook)}</div>
        <div class="take-row-meta">${take.script?'Script saved':'No script yet'}</div>
      </div>
      <span class="take-status${take.done?' filmed':''}">${take.done?'✓ Done':'Not filmed yet'}</span>
    </div>
    ${expanded?`<div class="take-expanded" onclick="handleTakeExpandedClick(event)">${renderTakeExpanded(card,take,totalTakes)}</div>`:''}
  </div>`;
}

  html+=`<button class="btn btn-ghost btn-xs js-toggle-script-edit" data-cid="${esc(card.id)}" data-tid="${esc(take.id)}">${take.script?(take.editingScript?'Cancel':'Edit'):'Add Script'}</button>
    ${take.script?`<button class="btn btn-ghost btn-xs js-save-script-library" data-cid="${esc(card.id)}" data-tid="${esc(take.id)}">Save</button>`:''}
    <button class="btn btn-ghost btn-xs" onclick="openScriptModal('${esc(card.id)}','${esc(take.id)}')">${take.script?'Swap':'Browse Scripts'}</button>

      </div>`;

      <button class="insp-add-btn" onclick="addInspirationLink('${esc(card.id)}','${esc(take.id)}')">Add</button>
    </div>
  </div>
  <div class="take-footer">
    <span class="take-status${take.done?' filmed':''}">${take.done?'✓ Done':'Not filmed yet'}</span>
    <div class="take-footer-btns">
      ${take.done?`<button class="tbtn done-active" onclick="clearSingleTake('${esc(card.id)}','${esc(take.id)}',this)">Clear</button>`:''}
      <button class="tbtn${take.done?' done-active':''}" onclick="toggleDone('${esc(card.id)}','${esc(take.id)}')">${take.done?'Undo':'Mark Done'}</button>
      ${totalTakes>1?`<button class="tbtn del" onclick="removeTake('${esc(card.id)}','${esc(take.id)}')">Remove</button>`:''}

function updateCardDoneCount(card){
  const cardEl=document.getElementById(card?.id);
  const countEl=cardEl?.querySelector('.pcard-count');
  const allTakes=card.takes||[];
  const text=`${allTakes.filter(t=>t.done).length}/${allTakes.length}`;
  if(countEl)countEl.textContent=countEl.classList.contains('product-progress-count')?`${text} done`:text;
  const subCount=document.querySelector('.takes-sub-count');
  if(subCount&&selectedProductId===card.id)subCount.textContent=`${text} done`;
}
function updateTakeDoneDom(card,take){
  const takeEl=document.getElementById(take?.id);
  if(!takeEl)return false;
  takeEl.classList.toggle('done',!!take.done);
  const marker=takeEl.querySelector('.take-filmed-marker');
  if(marker)marker.style.display=take.done?'':'none';
  takeEl.querySelectorAll('.take-status').forEach(status=>{
    status.classList.toggle('filmed',!!take.done);
    status.textContent=take.done?'✓ Done':'Not filmed yet';
  });
  const footerBtns=takeEl.querySelector('.take-footer-btns');
  if(footerBtns){
    footerBtns.innerHTML=`${take.done?`<button class="tbtn done-active" onclick="clearSingleTake('${esc(card.id)}','${esc(take.id)}',this)">Clear</button>`:''}
      <button class="tbtn${take.done?' done-active':''}" onclick="toggleDone('${esc(card.id)}','${esc(take.id)}')">${take.done?'Undo':'Mark Done'}</button>
      ${(card.takes||[]).length>1?`<button class="tbtn del" onclick="removeTake('${esc(card.id)}','${esc(take.id)}')">Remove</button>`:''}`;
  }
  updateCardDoneCount(card);
  return true;
}
function refreshProgressAndFilters(){
  renderWeekStrip();
  renderProgress();
  renderFilterPills();
}

function handleTakeExpandedClick(e){
  const t=e.target;
  const toggle=t.closest?.('.js-toggle-script-edit');
  if(toggle){
    e.preventDefault();
    e.stopPropagation();
    const{cid,tid}=toggle.dataset;
    const card=TODO.find(c=>c.id===cid);
    const take=card?.takes.find(t=>t.id===tid);
    if(take){
      take.editingScript=!take.editingScript;
      renderCards();
    }
    return;
  }
  const cancel=t.closest?.('.js-cancel-script-edit');
  if(cancel){
    e.preventDefault();
    e.stopPropagation();
    const take=TODO.find(c=>c.id===cancel.dataset.cid)?.takes.find(t=>t.id===cancel.dataset.tid);
    if(take){
      take.editingScript=false;
      renderCards();
    }
    return;
  }
  const save=t.closest?.('.js-save-script-edit');
  if(save){
    e.preventDefault();
    e.stopPropagation();
    const{cid,tid}=save.dataset;
    saveScriptEdit(cid,tid);
    return;
  }
  const librarySave=t.closest?.('.js-save-script-library');
  if(librarySave){
    e.preventDefault();
    e.stopPropagation();
    const{cid,tid}=librarySave.dataset;
    saveTakeScriptToLibrary(cid,tid,librarySave);
    return;
  }
  const copy=t.closest?.('.js-copy-take-script');
  if(copy){
    e.preventDefault();
    e.stopPropagation();
    const take=TODO.find(c=>c.id===copy.dataset.cid)?.takes.find(t=>t.id===copy.dataset.tid);
    if(take?.script)navigator.clipboard.writeText(take.script).then(()=>showToast('Copied!'));
    return;
  }
  e.stopPropagation();
}

function setBrandFilter(b){activeBrandFilter=b;selectedProductId=null;expandedTakeId=null;history.replaceState({},'','daily-todo.html');renderFilterPills();renderCards();}
function toggleHideFilmed(){
  hideFilmed=!hideFilmed;
  localStorage.setItem('take24:hideFilmed',hideFilmed?'1':'0');
  selectedProductId=null;
  expandedTakeId=null;
  replaceProductUrl(null);

}

let _dtUndoTimer=null, _dtUndoCard=null;
async function removeCard(cardId){
  const card=TODO.find(c=>c.id===cardId);
  if(!card)return;
  // Cancel any pending undo commit for a previous card
  if(_dtUndoTimer){clearTimeout(_dtUndoTimer);await _dtCommitRemove();}
  // Stash and optimistically remove
  _dtUndoCard=card;
  TODO=TODO.filter(c=>c.id!==cardId);
  render();
  showUndoToast(card.name,()=>{
    // Undo: restore
    if(_dtUndoCard){
      TODO=[...(TODO),_dtUndoCard];
      _dtUndoCard=null;
      if(_dtUndoTimer){clearTimeout(_dtUndoTimer);_dtUndoTimer=null;}
      render();
    }
  });
  _dtUndoTimer=setTimeout(()=>_dtCommitRemove(),5000);
}
async function _dtCommitRemove(){
  if(_dtUndoCard){
    for(const take of _dtUndoCard.takes||[])await deleteQueueRow(take);
    _dtUndoCard=null;
  }
  _dtUndoTimer=null;
}
function showUndoToast(name,onUndo){
  let toast=document.getElementById('_undoToast');
  if(!toast){
    toast=document.createElement('div');
    toast.id='_undoToast';
    toast.className='undo-toast';
    document.body.appendChild(toast);
  }
  toast.innerHTML=`<span>"${esc(name)}" removed</span><button class="undo-toast-btn" id="_undoBtn">Undo</button>`;
  document.getElementById('_undoBtn').onclick=()=>{
    toast.classList.remove('visible');
    onUndo();
  };
  requestAnimationFrame(()=>toast.classList.add('visible'));
  clearTimeout(toast._hideTimer);
  toast._hideTimer=setTimeout(()=>toast.classList.remove('visible'),5000);
}
async function addTake(cardId){
  const card=TODO.find(c=>c.id===cardId);if(!card)return;
  const take={id:'t-'+uid(),queueId:null,hookText:'',script:'',inspirationLinks:[],done:false,sortOrder:card.takes.length,editingScript:false};
  card.takes.push(take);render();await saveQueueRow(card,take);
}
async function removeTake(cardId,takeId){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  if(!take)return;await deleteQueueRow(take);card.takes=card.takes.filter(t=>t.id!==takeId);render();
}
async function toggleDone(cardId,takeId){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  if(!take)return;
  take.done=!take.done;
  if(hideFilmed&&take.done){
    renderCards();
  } else if(!updateTakeDoneDom(card,take)) {
    renderCards();
  }
  refreshProgressAndFilters();
  if(take.queueId)await db.from('queue').update({done:take.done}).eq('id',take.queueId);
}
async function setFilmingLocation(cardId,takeId,type){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  if(!take)return;
  take.hookText=setFilmingLocationLine(take.hookText,type);
  renderCards();
  if(type==='other')setTimeout(()=>document.getElementById('loc-'+takeId)?.focus(),40);
  if(take.queueId)await saveQueueRow(card,take);
}
async function saveOtherLocation(cardId,takeId){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  const input=document.getElementById('loc-'+takeId);
  if(!take||!input)return;
  take.hookText=setFilmingLocationLine(take.hookText,'other',input.value);

}
async function setFilmingType(cardId,takeId,type){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  if(!take)return;
  take.hookText=setFilmingTypeLine(take.hookText,type);

  if(take.queueId)await saveQueueRow(card,take);

async function saveTakeField(cardId,takeId,field){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);
  const input=document.getElementById(`take-${field}-${takeId}`);
  if(!take||!input)return;
  take.hookText=setTakeFieldLine(take.hookText,field,input.value);

}
function videoRowFromTake(card,take){
  const notes=[];
  const loc=getFilmingLocation(take.hookText);
  const type=getFilmingType(take.hookText);
  const onScreen=getTakeField(take.hookText,'onscreen');
  const seo=getTakeField(take.hookText,'seo');
  const caption=getTakeField(take.hookText,'caption');
  const hashtags=getTakeField(take.hookText,'hashtags');
  const hook=displayHookText(take.hookText);
  const snapshot={
    product:card.name||'',
    brand:card.brand||'',
    prodId:card.prodId||null,
    hook,
    location:loc.type?loc:null,
    type:type.type?type:null,
    onScreen,
    seo,
    caption,
    hashtags,
    script:take.script||'',
    inspirationLinks:normalizeInspirationLinks(take.inspirationLinks)
  };
  notes.push('Product: '+card.name);
  notes.push('TAKE_SNAPSHOT:'+encodeTakeSnapshot(snapshot));
  if(hook)notes.push('Hook: '+hook);
  if(loc.type)notes.push('Location: '+(loc.type==='other'?(loc.label||'Other'):loc.label));
  if(type.type)notes.push('Type: '+type.label);
  if(onScreen)notes.push('On-screen text: '+onScreen);
  if(seo)notes.push('SEO strategy: '+seo);
  if(caption)notes.push('Caption: '+caption);
  if(hashtags)notes.push('Hashtags: '+hashtags);
  if(take.script)notes.push('Script: '+take.script);
  if(take.inspirationLinks?.length)notes.push('Inspiration: '+take.inspirationLinks.join(', '));
	  return {
	    user_id:_user.id,
	    title:displayHookText(take.hookText)||card.name,
	    brand:card.name,
	    prod_id:card.prodId||null,
	    date:currentKey(),
	    posted_time:currentTimeValue(),
	    status:'live',
	    notes:notes.join('\n')
	  };
	}
function currentTimeValue(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
async function insertVideoRows(rows){
  let {error}=await db.from('videos').insert(rows);
  if(error&&/(posted_time|prod_id)/i.test(error.message||'')){
    const fallbackRows=rows.map(row=>{
      const next={...row};
      if(/posted_time/i.test(error.message||''))delete next.posted_time;
      if(/prod_id/i.test(error.message||''))delete next.prod_id;
      return next;
    });
    const retry=await db.from('videos').insert(fallbackRows);
    error=retry.error;
  }
  return {error};
}
async function clearDoneToday(btn){
  const donePairs=[];
  TODO.forEach(card=>(card.takes||[]).forEach(take=>{if(take.done)donePairs.push({card,take});}));
  if(!donePairs.length){showToast('No done tasks yet');return;}
  const original=btn?.textContent||'Clear Done';
  if(btn){btn.disabled=true;btn.textContent='Clearing...';}
  const rows=donePairs.map(({card,take})=>videoRowFromTake(card,take));
  const {error}=await insertVideoRows(rows);
  if(error){
    if(btn){btn.disabled=false;btn.textContent=original;}
    showToast('Could not save to Content Tracker: '+error.message,'error');
    return;
  }
  const ids=donePairs.map(({take})=>take.queueId).filter(Boolean);
  if(ids.length)await db.from('queue').delete().in('id',ids).eq('user_id',_user.id);
  donePairs.forEach(({card,take})=>{if(take.queueId)sessionStorage.removeItem('ts-'+take.queueId);card.takes=card.takes.filter(item=>item.id!==take.id);});
  TODO=TODO.filter(card=>(card.takes||[]).length>0);
  if(btn)btn.textContent=original;
  render();
  showToast(`Saved ${rows.length} to Content Tracker`);
}
async function clearSingleTake(cardId,takeId,btn){
  const card=TODO.find(c=>c.id===cardId);
  const take=card?.takes.find(t=>t.id===takeId);
  if(!card||!take)return;
  const original=btn?.textContent||'Clear';
  if(btn){btn.disabled=true;btn.textContent='Clearing...';}
  const row=videoRowFromTake(card,take);
  const {error}=await insertVideoRows([row]);
  if(error){
    if(btn){btn.disabled=false;btn.textContent=original;}
    showToast('Could not save to Content Tracker: '+error.message,'error');
    return;
  }
  if(take.queueId){
    await db.from('queue').delete().eq('id',take.queueId).eq('user_id',_user.id);
    sessionStorage.removeItem('ts-'+take.queueId);
  }
  card.takes=card.takes.filter(item=>item.id!==take.id);
  TODO=TODO.filter(item=>(item.takes||[]).length>0);
  render();
  showToast('Saved to Content Tracker');
}
function copyAllScripts(btn){
  const all=[];TODO.forEach(card=>card.takes.forEach((take,i)=>{if(take.script)all.push(`${card.name.toUpperCase()}${card.takes.length>1?' — Take '+(i+1):''}\n${take.script}`);}));
  if(!all.length){showToast('No scripts yet!');return;}
  navigator.clipboard.writeText(all.join('\n\n---\n\n')).then(()=>{btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='📋 Copy All',2000);showToast(`Copied ${all.length} script${all.length>1?'s':''}`);});
}

async function addInspirationLink(cardId,takeId){
  const input=document.getElementById('insp-'+takeId);if(!input)return;
  const url=normalizeUrl(input.value);if(!url)return;
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);if(!take)return;
  take.inspirationLinks=[...(take.inspirationLinks||[]),url];input.value='';renderCards();
  if(take.queueId)await saveQueueRow(card,take);
}
async function removeInspirationLink(cardId,takeId,index){
  const card=TODO.find(c=>c.id===cardId),take=card?.takes.find(t=>t.id===takeId);if(!take)return;
  take.inspirationLinks=(take.inspirationLinks||[]).filter((_,i)=>i!==index);renderCards();
  if(take.queueId)await saveQueueRow(card,take);
}

const scriptAutosaveTimers=new Map();
async function persistScriptDraft(cid,tid,options={}){
  const card=TODO.find(c=>c.id===cid);
  const take=card?.takes.find(t=>t.id===tid);
  const ta=document.getElementById('sta-'+tid);
  if(!take||!ta)return false;
  take.script=ta.value.trim();
  try {
    await saveQueueRow(card,take);
    if(options.toast)showToast('Script saved');
    return true;
  } catch(err) {
    console.error('Script save error:', err);
    if(options.toast!==false)showToast('Save failed: '+err.message, 'error');
    return false;
  }
}
function queueScriptAutosave(cid,tid){
  const key=`${cid}:${tid}`;
  clearTimeout(scriptAutosaveTimers.get(key));
  scriptAutosaveTimers.set(key,setTimeout(async()=>{
    scriptAutosaveTimers.delete(key);
    await persistScriptDraft(cid,tid,{toast:false});
  },700));
}
async function saveScriptEdit(cid,tid){
  const key=`${cid}:${tid}`;
  clearTimeout(scriptAutosaveTimers.get(key));
  scriptAutosaveTimers.delete(key);
  const saved=await persistScriptDraft(cid,tid,{toast:true});
  if(saved){
    const take=TODO.find(c=>c.id===cid)?.takes.find(t=>t.id===tid);
    if(take)take.editingScript=false;
    renderCards();
  }
}
function scriptLibraryTitle(card,take){
  const hook=displayHookText(take?.hookText);
  if(hook)return `${card.name} — ${hook}`.slice(0,120);
  return `${card.name} Script`;
}
async function saveTakeScriptToLibrary(cid,tid,btn){
  const card=TODO.find(c=>c.id===cid);
  const take=card?.takes.find(t=>t.id===tid);
  if(!card||!take?.script?.trim()){showToast('Add a script first','error');return;}
  const original=btn?.textContent||'Save';
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  const row={
    user_id:_user.id,
    title:scriptLibraryTitle(card,take),
    brand:card.name||card.brand||'',
    cat:'review',
    script:take.script.trim(),
    notes:[
      card.brand?`Brand: ${card.brand}`:'',
      displayHookText(take.hookText)?`Hook: ${displayHookText(take.hookText)}`:''
    ].filter(Boolean).join('\n')
  };
  const {data,error}=await db.from('scripts').insert(row).select('id,title,brand,script').single();
  if(btn){btn.disabled=false;btn.textContent=original;}
  if(error){showToast('Could not save to Scripts: '+error.message,'error');return;}
  if(data)ALL_SCRIPTS=[data,...ALL_SCRIPTS];
  showToast('Saved to Scripts Library');
}

// ─── DELEGATED EVENTS ─────────────────────────────────────
document.body.addEventListener('click',e=>{
  const t=e.target;
  const toggle=t.closest('.js-toggle-script-edit');
  if(toggle){const{cid,tid}=toggle.dataset;const card=TODO.find(c=>c.id===cid);const take=card?.takes.find(t=>t.id===tid);if(take){take.editingScript=!take.editingScript;renderCards();}return;}
  const cancel=t.closest('.js-cancel-script-edit');
  if(cancel){const take=TODO.find(c=>c.id===cancel.dataset.cid)?.takes.find(t=>t.id===cancel.dataset.tid);if(take){take.editingScript=false;renderCards();}return;}
  const save=t.closest('.js-save-script-edit');
  if(save){const{cid,tid}=save.dataset;saveScriptEdit(cid,tid);return;}
  const librarySave=t.closest('.js-save-script-library');
  if(librarySave){const{cid,tid}=librarySave.dataset;saveTakeScriptToLibrary(cid,tid,librarySave);return;}
  const copy=t.closest('.js-copy-take-script');
  if(copy){const take=TODO.find(c=>c.id===copy.dataset.cid)?.takes.find(t=>t.id===copy.dataset.tid);if(take?.script)navigator.clipboard.writeText(take.script).then(()=>showToast('Copied!'));return;}
});

document.body.addEventListener('input',e=>{
  const scriptEdit=e.target.closest?.('.script-textarea');
  if(!scriptEdit)return;
  const {cid,tid}=scriptEdit.dataset;
  const card=TODO.find(c=>c.id===cid);
  const take=card?.takes.find(t=>t.id===tid);
  if(!take)return;
  take.script=scriptEdit.value.trim();
  queueScriptAutosave(cid,tid);
});

document.body.addEventListener('focusout',e=>{
  const scriptEdit=e.target.closest?.('.script-textarea');
  if(!scriptEdit)return;
  const {cid,tid}=scriptEdit.dataset;
  const key=`${cid}:${tid}`;
  clearTimeout(scriptAutosaveTimers.get(key));
  scriptAutosaveTimers.delete(key);
  persistScriptDraft(cid,tid,{toast:false});
});

document.body.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const openModal=document.querySelector('.modal-overlay.open');
    if(openModal){
      openModal.classList.remove('open');
      return;
    }
  }
  const scriptEdit=e.target.closest?.('.script-textarea');
  if(scriptEdit){
    const tid=scriptEdit.id.replace('sta-','');
    const card=TODO.find(c=>c.takes.some(t=>t.id===tid));
    if(card) enterSaves(e,()=>saveScriptEdit(card.id,tid));
    return;
  }
  if(e.target===document.getElementById('customHookInput')) enterSaves(e,saveCustomHook);
});

// ─── PRODUCT PICKER ───────────────────────────────────────
function openPicker(){pickerSelected=new Set(TODO.map(c=>c.prodId).filter(Boolean));document.getElementById('pickerSearch').value='';filterPicker();document.getElementById('pickerModal').classList.add('open');setTimeout(()=>document.getElementById('pickerSearch').focus(),80);}
function closePicker(){document.getElementById('pickerModal').classList.remove('open');}
function filterPicker(){
  const q=document.getElementById('pickerSearch').value.toLowerCase();
  const list=ALL_PRODUCTS.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q));
  document.getElementById('pickerList').innerHTML=list.map(p=>`<div class="picker-item${pickerSelected.has(p.id)?' selected':''}" onclick="togglePick('${p.id}')"><div class="picker-check">${pickerSelected.has(p.id)?'✓':''}</div><div><div class="picker-name">${esc(p.name)}</div>${p.brand?`<div class="picker-meta">${esc(p.brand)}</div>`:''}</div></div>`).join('')||'<div style="text-align:center;padding:24px;color:var(--text-muted);font-style:italic;">No products found</div>';
}
function togglePick(id){if(pickerSelected.has(id))pickerSelected.delete(id);else pickerSelected.add(id);filterPicker();}
async function addSelectedProducts(){
  const existing=new Set(TODO.map(c=>c.prodId).filter(Boolean));
  const toAdd=[...pickerSelected].filter(id=>!existing.has(id));
  const toRemove=TODO.filter(card=>card.prodId&&!pickerSelected.has(card.prodId));
  const btn=document.getElementById('pickerConfirmBtn');btn.disabled=true;btn.textContent='Saving...';
  for(const card of toRemove){
    for(const take of card.takes||[]) await deleteQueueRow(take);
    sessionStorage.removeItem('script-'+card.id+'-'+currentKey());
  }
  TODO=TODO.filter(card=>!card.prodId||pickerSelected.has(card.prodId));
  for(const id of toAdd){
    const p=ALL_PRODUCTS.find(x=>x.id===id);if(!p)continue;
    const card={id:'c-'+uid(),prodId:p.id,name:p.name,brand:p.brand||'',script:'',takes:[]};
    const take={id:'t-'+uid(),queueId:null,hookText:'',script:'',inspirationLinks:[],done:false,sortOrder:0,editingScript:false};
    card.takes.push(take);TODO.push(card);await saveQueueRow(card,take);
  }
  if(activeBrandFilter!=='All'&&!TODO.some(card=>(card.brand||'')===activeBrandFilter)) activeBrandFilter='All';
  closePicker();btn.disabled=false;btn.textContent='Save';render();
  const changes=toAdd.length+toRemove.length;
  showToast(changes?`Saved ${changes} change${changes>1?'s':''}`:'No changes');
}

// ─── HOOK PICKER ──────────────────────────────────────────
function openHookModal(cardId,takeId){
  hookTarget={cardId,takeId};const card=TODO.find(c=>c.id===cardId);
  document.getElementById('hookModalSub').textContent=card?'For: '+card.name:'';
  document.getElementById('customHookInput').value='';document.getElementById('hookSearch').value='';
  filterHooks();document.getElementById('hookModal').classList.add('open');
}
function closeHookModal(){document.getElementById('hookModal').classList.remove('open');}
function filterHooks(){
  const q=document.getElementById('hookSearch').value.toLowerCase();
  const filtered=ALL_HOOKS.filter(h=>!q||h.text.toLowerCase().includes(q)||(h.cat||'').toLowerCase().includes(q));
  const grouped={};filtered.forEach(h=>{const cat=h.cat||'Other';if(!grouped[cat])grouped[cat]=[];grouped[cat].push(h);});
  let html='';Object.entries(grouped).forEach(([cat,hooks])=>{html+=`<div class="hook-cat-label">${esc(cat)}</div>`;hooks.forEach(h=>{html+=`<div class="hook-item" onclick="selectHook('${h.id}')">${esc(h.text)}</div>`;});});
  document.getElementById('hookList').innerHTML=html||'<div style="text-align:center;padding:24px;color:var(--text-muted);font-style:italic;">No hooks yet — add some on the Hooks page!</div>';
}
async function selectHook(hookId){
  const hook=ALL_HOOKS.find(h=>h.id===hookId);if(!hook||!hookTarget)return;
  const take=TODO.find(c=>c.id===hookTarget.cardId)?.takes.find(t=>t.id===hookTarget.takeId);if(!take)return;
  take.hookText=replaceVisibleHook(take.hookText,hook.text);closeHookModal();renderCards();
  if(take.queueId)await db.from('queue').update({notes:take.hookText}).eq('id',take.queueId);
}
async function saveCustomHook(){
  const text=document.getElementById('customHookInput').value.trim();if(!text||!hookTarget)return;
  const take=TODO.find(c=>c.id===hookTarget.cardId)?.takes.find(t=>t.id===hookTarget.takeId);if(!take)return;
  take.hookText=replaceVisibleHook(take.hookText,text);closeHookModal();renderCards();
  if(take.queueId)await db.from('queue').update({notes:take.hookText}).eq('id',take.queueId);
}

// ─── SCRIPT PICKER ────────────────────────────────────────
function openScriptModal(cardId,takeId){
  scriptTarget={cardId,takeId};const card=TODO.find(c=>c.id===cardId);
  document.getElementById('scriptModalSub').textContent=card?'For: '+card.name:'';
  document.getElementById('scriptSearch').value='';filterScripts();document.getElementById('scriptModal').classList.add('open');
}
function closeScriptModal(){document.getElementById('scriptModal').classList.remove('open');}
function filterScripts(){
  const q=document.getElementById('scriptSearch').value.toLowerCase();
  const card=TODO.find(c=>c.id===scriptTarget?.cardId);
  const sorted=[...ALL_SCRIPTS].sort((a,b)=>{const am=card&&(a.brand||'').toLowerCase()===(card.brand||'').toLowerCase();const bm=card&&(b.brand||'').toLowerCase()===(card.brand||'').toLowerCase();return bm-am;});
  const filtered=sorted.filter(s=>!q||s.title.toLowerCase().includes(q)||(s.brand||'').toLowerCase().includes(q)||s.script.toLowerCase().includes(q));
  document.getElementById('scriptList').innerHTML=filtered.map(s=>`<div class="script-pick-item" onclick="selectScript('${s.id}')">${s.brand?`<div class="script-pick-brand">${esc(s.brand)}</div>`:''}<div class="script-pick-title">${esc(s.title)}</div><div class="script-pick-preview">${esc(s.script)}</div></div>`).join('')||'<div style="text-align:center;padding:24px;color:var(--text-muted);font-style:italic;">No scripts yet — add some on the Scripts page!</div>';
}
function selectScript(scriptId){
  const script=ALL_SCRIPTS.find(s=>s.id===scriptId);if(!script||!scriptTarget)return;
  const card=TODO.find(c=>c.id===scriptTarget.cardId);
  const take=card?.takes.find(t=>t.id===scriptTarget.takeId);if(!take)return;
  take.script=script.script;
  closeScriptModal();renderCards();
  if(take.queueId) saveQueueRow(card,take);
}

['pickerModal','hookModal','scriptModal'].forEach(id=>{document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});});

// ─── INIT ─────────────────────────────────────────────────
async function init(){
  _user=await requireAuth();if(!_user)return;
  const prefs=await loadUserPrefs(_user.id);
  await initDisplayName(_user,prefs);
  await initCore5(_user.id,prefs);
  await initTheme(_user.id,prefs);
  initProfilePopover(_user.id);
  updateDateDisplay();
  await Promise.all([loadProducts(),loadHooks(),loadScripts(),loadQueue()]);
  selectedProductId=selectedProductFromUrl();
  render();
}
init();
</script>
