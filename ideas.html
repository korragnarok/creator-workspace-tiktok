<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F1F1E">
<title>Content Ideas — Take24</title>
<script src="theme-init.js?v=193"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Bad+Script&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:var(--bg);--card:var(--surface);--line:var(--border-mid);--char:var(--surface-2);--muted:var(--text-muted);--cream:var(--ink);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font:13px 'Nunito Sans',sans-serif;padding:26px;padding-top:max(26px,env(safe-area-inset-top));
  background-image:radial-gradient(rgba(196,160,131,.05) 1px,transparent 1px);background-size:14px 14px;background-attachment:fixed;}
.wrap{max-width:1180px;margin:0 auto;}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
h1{font:300 40px 'Cormorant Garamond',serif;color:var(--cream);}
h1 em{font:26px 'Bad Script',cursive;color:var(--tan);font-style:normal;}
.btn{border:1px solid var(--line);background:var(--char);color:var(--cream);border-radius:999px;padding:9px 16px;font:800 11px 'Nunito Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block;}
.btn:hover,.btn.on{background:var(--rust);}
.addbar{display:flex;gap:10px;margin-bottom:14px;}
.addbar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:14px 'Nunito Sans',sans-serif;outline:none;}
.addbar input:focus{border-color:var(--tan);}
.filters{display:flex;gap:8px;margin-bottom:18px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;align-items:start;}
.icard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .15s,border-color .15s;}
.icard:hover{border-color:var(--tan);}
.icard.done{opacity:.5;}
.icard.text{padding:18px 16px 44px;min-height:140px;}
.icard.text .t{font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.3;color:var(--cream);white-space:pre-wrap;word-break:break-word;}
.icard.video{cursor:pointer;}
.thumb{aspect-ratio:9/14;background:#1a1918 center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;}
.thumb.ph{background:linear-gradient(160deg,#4a3024,#2B2A29 60%,#373635);}
.thumb .play{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;padding-left:4px;}
.thumb .plat{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:var(--cream);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800;letter-spacing:.06em;}
.icard.video .t{padding:10px 12px 40px;font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.acts{position:absolute;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.acts label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;}
.acts input{accent-color:var(--tan);}
.del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.del:hover{color:var(--cream);background:var(--char);}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:50px 20px;background:var(--card);border:1px dashed var(--line);border-radius:18px;}
.empty b{display:block;font:24px 'Cormorant Garamond',serif;color:var(--cream);margin-bottom:6px;font-weight:400;}
/* watch popup */
.modal{position:fixed;inset:0;z-index:500;background:rgba(10,8,7,.86);display:none;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.mcard{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.55);}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.mtitle{font:24px 'Cormorant Garamond',serif;color:var(--cream);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.morig{font:15px 'Bad Script',cursive;color:var(--tan);text-decoration:none;}
.frame{border-radius:16px;overflow:hidden;background:#000;height:min(72vh,680px);}
.frame iframe{width:100%;height:100%;border:0;display:block;}
body.watching .wrap{visibility:hidden;}
body.watching{background-image:none!important;}
.frame iframe{transform:translateZ(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Content Ideas <em>save it, film it</em></h1>
    <a class="btn" href="index.html">← Home</a>
  </header>
  <div class="addbar">
    <input id="addInput" placeholder="Type an idea, or paste a video link (add a note before it if you want)…">
    <button class="btn on" onclick="addIdea()">Add</button>
  </div>
  <div class="filters">
    <button class="btn on" data-f="all">All</button>
    <button class="btn" data-f="video">Videos</button>
    <button class="btn" data-f="text">Notes</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="watchModal" role="dialog" aria-modal="true">
  <div class="mcard">
    <div class="mhead"><div><div class="mtitle" id="watchTitle"></div><a class="morig" id="watchOpen" href="#" target="_blank" rel="noopener">open original ↗</a></div><button class="btn" onclick="closeWatch()">Close</button></div>
    <div class="frame"><iframe id="watchFrame" src="about:blank" allow="autoplay; encrypted-media; picture-in-picture; clipboard-write" allowfullscreen></iframe></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=193"></script>
<script src="planner-sync.js?v=198"></script>
<script src="layout.js?v=193"></script>
<script>
// Same saved list as the dashboard card (stored on this device)
const KEY='take24:ideas';   // TikTok side keeps its own ideas (separate from Meta)
const META_WORKER_URL='https://take24-scout.kortnycall5.workers.dev';
// Synced through Supabase (planner-sync.js) — same list on phone and computer
let IDEAS=[];
const loadIdeas=()=>JSON.parse(JSON.stringify(IDEAS));
const saveIdeas=l=>{ IDEAS=l; plannerSet('ideas',l); };
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let filter='all';

function platformOf(url){ const u=String(url||'');
  if(/instagram\.com/i.test(u)) return 'Instagram'; if(/tiktok\.com/i.test(u)) return 'TikTok';
  if(/facebook\.com|fb\.watch/i.test(u)) return 'Facebook'; if(/youtu\.?be/i.test(u)) return 'YouTube'; return 'Link'; }
function embedUrl(url){
  const u=String(url||'').trim(); let m;
  if((m=u.match(/instagram\.com\/(?:[^\/]+\/)?(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i))) return `https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed`;
  if((m=u.match(/tiktok\.com\/.*\/video\/(\d+)/i))) return `https://www.tiktok.com/embed/v2/${m[1]}`;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i))) return `https://www.youtube.com/embed/${m[1]}`;
  if(/facebook\.com|fb\.watch/i.test(u)) return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false&width=400`;
  return null;
}
// Thumbnails: YouTube is instant; TikTok via its public oEmbed; Instagram/Facebook via Meta's
// oEmbed through the worker. If one can't be fetched, the card keeps its styled cover.
// Remember thumbnails for this browser session so cards don't flash/reload every time the list changes
const THUMBS=(()=>{ try{ return JSON.parse(sessionStorage.getItem('take24:ideaThumbs'))||{}; }catch(e){ return {}; } })();
const THUMB_PENDING={};
function thumbFor(it){
  if(it.thumb) return Promise.resolve(it.thumb);
  if(it.link in THUMBS) return Promise.resolve(THUMBS[it.link]);
  if(!THUMB_PENDING[it.link]) THUMB_PENDING[it.link]=fetchThumb(it).then(t=>{ THUMBS[it.link]=t; try{ sessionStorage.setItem('take24:ideaThumbs',JSON.stringify(THUMBS)); }catch(e){} return t; });
  return THUMB_PENDING[it.link];
}
async function fetchThumb(it){
  const u=it.link; let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i))) return `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg`;
  if(/instagram\.com|facebook\.com|fb\.watch/i.test(u)){
    // Meta's oEmbed needs the app secret, so it goes through your Cloudflare worker
    try{ const d=await (await fetch(`${META_WORKER_URL}/?service=meta&action=oembed&url=${encodeURIComponent(u)}`)).json(); if(d?.thumbnail_url) return d.thumbnail_url; }catch(e){}
  }
  if(/tiktok\.com/i.test(u)){
    try{ const d=await (await fetch(`https://www.tiktok.com/oembed?url=${encodeURIComponent(u)}`)).json(); if(d?.thumbnail_url) return d.thumbnail_url; }catch(e){}
  }
  return '';
}

function render(){
  const all=loadIdeas().map((it,i)=>({...it,i}));
  const list=all.filter(it=>filter==='all'||(filter==='video'?!!it.link:!it.link)).reverse();
  const g=document.getElementById('grid');
  if(!list.length){ g.innerHTML=`<div class="empty"><b>${all.length?'Nothing here':'No ideas yet'}</b>${all.length?'Try another filter.':'Type an idea above, or paste a link to a video you want to remember.'}</div>`; return; }
  g.innerHTML=list.map(it=>{
    const acts=`<div class="acts"><label onclick="event.stopPropagation()"><input type="checkbox" ${it.done?'checked':''} onchange="toggleDone(${it.i},this.checked)"> filmed</label><button class="del" title="Delete" onclick="event.stopPropagation();delIdea(${it.i})">×</button></div>`;
    if(!it.link) return `<div class="icard text${it.done?' done':''}"><div class="t">${esc(it.text)}</div>${acts}</div>`;
    const known=it.thumb||THUMBS[it.link]||'';
    return `<div class="icard video${it.done?' done':''}" onclick="openWatch(${it.i})"><div class="thumb${known?'':' ph'}" data-thumb="${it.i}"${known?` style="background-image:url('${known.replace(/'/g,'%27')}')"`:''}><span class="plat">${esc(platformOf(it.link))}</span><span class="play">▶</span></div><div class="t">${esc(it.text)}</div>${acts}</div>`;
  }).join('');
  // fill in thumbnails as they load, and remember them
  list.filter(it=>it.link&&!it.thumb&&!(it.link in THUMBS)).forEach(async it=>{
    const t=await thumbFor(it); if(!t) return;
    const el=document.querySelector(`[data-thumb="${it.i}"]`); if(el){ el.style.backgroundImage=`url('${t.replace(/'/g,'%27')}')`; el.classList.remove('ph'); }
    if(/youtu/i.test(it.link)){ const l=loadIdeas(); const k=l.findIndex(x=>x.link===it.link); if(k>=0&&!l[k].thumb){ l[k].thumb=t; saveIdeas(l); } }
  });
}
function addIdea(){
  const inp=document.getElementById('addInput'), raw=inp.value.trim(); if(!raw) return;
  const m=raw.match(/https?:\/\/\S+/i), link=m?m[0]:'';
  const text=(m?raw.replace(m[0],'').trim():raw)||(link?`${platformOf(link)} video`:'');
  const l=loadIdeas(); l.push({text,done:false,...(link?{link}:{})}); saveIdeas(l); inp.value=''; render();
}
function toggleDone(i,v){ const l=loadIdeas(); if(l[i]){ l[i].done=v; saveIdeas(l); render(); } }
function delIdea(i){ const l=loadIdeas(); l.splice(i,1); saveIdeas(l); render(); }
function openWatch(i){
  const it=loadIdeas()[i]; if(!it?.link) return;
  const src=embedUrl(it.link); if(!src){ window.open(it.link,'_blank','noopener'); return; }
  document.getElementById('watchTitle').textContent=it.text; document.getElementById('watchOpen').href=it.link;
  document.getElementById('watchFrame').src=src; document.getElementById('watchModal').classList.add('open'); document.body.classList.add('watching');
}
function closeWatch(){ document.body.classList.remove('watching'); document.getElementById('watchModal').classList.remove('open'); document.getElementById('watchFrame').src='about:blank'; }
document.getElementById('watchModal').addEventListener('click',e=>{ if(e.target.id==='watchModal') closeWatch(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeWatch(); });
document.getElementById('addInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addIdea(); });
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); render(); });
(async()=>{ const {data:{session}}=await db.auth.getSession(); if(!session){ location.href='auth.html'; return; } IDEAS=await plannerGet('ideas',[]); render();
  try{ const prefs=await loadUserPrefs(session.user.id); await initTheme(session.user.id,prefs); await initDisplayName(session.user,prefs); initProfilePopover(session.user.id);}catch(e){} })();
</script>
</body>
</html>
