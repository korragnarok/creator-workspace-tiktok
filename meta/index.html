<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Take24 Meta</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EC;--surface:#FFFFFF;--sage:#8A9A7B;--sage-soft:#E4EADD;--lav:#A99BC2;--lav-soft:#ECE7F3;--brown:#6B5446;--brown-soft:#EFE6DE;--text:#3E3530;--muted:#8C8078;--border:rgba(107,84,70,.12);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;padding:28px;padding-top:max(28px,env(safe-area-inset-top));}
header{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 28px;}
.brand{font-weight:800;font-size:22px;color:var(--brown);}
.brand span{color:var(--lav);}
.actions{display:flex;gap:10px;}
.pill{border:1px solid var(--border);background:var(--surface);color:var(--brown);border-radius:999px;padding:9px 16px;font:700 13px 'Nunito',sans-serif;cursor:pointer;}
.pill:hover{background:var(--sage-soft);}
main{max-width:1100px;margin:0 auto;}
.hello{font-size:28px;font-weight:800;color:var(--brown);margin-bottom:4px;}
.subhello{color:var(--muted);margin-bottom:24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 6px 24px rgba(107,84,70,.06);}
.card h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.card.fb{background:var(--lav-soft);} .card.fb h3{color:#6E5E8C;}
.card.ig{background:var(--sage-soft);} .card.ig h3{color:#5F6E52;}
.card.aff{background:var(--brown-soft);} .card.aff h3{color:var(--brown);}
.card p{color:var(--muted);font-size:14px;line-height:1.5;}
.soon{display:inline-block;margin-top:12px;background:rgba(255,255,255,.7);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;color:var(--muted);}
</style>
</head>
<body>
<header>
  <div class="brand">Take24 <span>Meta</span></div>
  <div class="actions">
    <button class="pill" onclick="switchToTikTok()">Switch to TikTok</button>
    <button class="pill" onclick="signOut()">Sign out</button>
  </div>
</header>
<main>
  <div class="hello">Hi there 🌿</div>
  <div class="subhello">Your Facebook, Instagram, and affiliate workspace.</div>
  <div class="grid">
    <div class="card fb"><h3>Facebook</h3><p>Videos posted and follower growth across your Pages.</p><span class="soon">Coming soon</span></div>
    <div class="card ig"><h3>Instagram</h3><p>Reels, views, saves, and followers.</p><span class="soon">Coming soon</span></div>
    <div class="card aff"><h3>Affiliate Links</h3><p>Amazon and Mavely links, clicks, and earnings.</p><span class="soon">Coming soon</span></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="meta-supabase.js?v=1"></script>
<script>requireMetaAuth();</script>
</body>
</html>
